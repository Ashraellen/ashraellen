    <meta name="keywords" content="ashraellen, monolith, language, gateway, beton, sludge, gas, doctype, html, title, function, var, routes, languages, navigator.languages, navigator.language, target, routes.en">
  <link rel="canonical" href="https://www.ashraellen.com/monolith/">
  <script>
    (function () {
      var routes = {
        en: "/en/monolith/",
        ru: "/ru/monolith/",
        be: "/be/monolith/",
        pl: "/pl/monolith/",
        de: "/de/monolith/",
        es: "/es/monolith/",
        fr: "/fr/monolith/",
        pt: "/pt/monolith/",
        uk: "/uk/monolith/"
      };

      var languages = navigator.languages || [navigator.language || "en"];
      var target = routes.en;

      for (var i = 0; i < languages.length; i++) {
        var code = String(languages[i]).toLowerCase().split("-")[0];
        if (routes[code]) {
          target = routes[code];
          break;
        }
      }

      window.location.replace(target);
    })();
  </script>
