  <style>
    :root{--bg:#08090b;--fg:#f2f2f4;--muted:#aaaab2;--line:rgba(242,242,244,.16);--panel:rgba(0,0,0,.44)}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(rgba(8,9,11,.72),rgba(8,9,11,.88)),url('/assets/backgrounds/monolith-bg.webp') center/cover fixed no-repeat}
    main{width:min(820px,100%);padding:42px 28px;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(10px);text-align:center}
    .kicker{margin:0 0 12px;color:var(--muted);font-size:12px;letter-spacing:.22em;text-transform:uppercase}
    h1{margin:0;font:400 clamp(46px,10vw,86px)/1 Georgia,'Times New Roman',serif;letter-spacing:.12em}
    .states{margin:14px 0 10px;font-family:Georgia,'Times New Roman',serif;font-size:clamp(18px,3vw,26px);letter-spacing:.08em}
    .status{margin:0 0 26px;color:var(--muted);line-height:1.6}
    nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}
    a{display:block;padding:11px 8px;border:1px solid var(--line);color:var(--fg);text-decoration:none;background:rgba(255,255,255,.035);font-size:13px}
    a:hover,a:focus-visible{background:rgba(255,255,255,.09);outline:none;border-color:rgba(242,242,244,.34)}
    .fallback{margin:22px 0 0;color:var(--muted);font-size:12px}
    @media(max-width:720px){nav{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:420px){body{padding:14px}main{padding:34px 18px}nav{grid-template-columns:1fr}h1{letter-spacing:.08em}}
  </style>
  <script defer src="/assets/analytics.js"></script>
  <script type="application/ld+json">
  {
    "@context":"https://schema.org",
    "@type":"WebPage",
    "name":"MONOLITH — Ashraellen",
    "description":"Language gateway for the MONOLITH trilogy: BETON, SLUDGE and GAS.",
    "url":"https://www.ashraellen.com/monolith/",
    "isPartOf":{"@type":"WebSite","name":"Ashraellen","url":"https://www.ashraellen.com/"},
    "author":{"@type":"Person","name":"Ashraellen"}
  }
  </script>
  <script>
    (function(){
      var routes={
        en:'/en/books/monolith/',ru:'/ru/books/monolith/',pl:'/pl/books/monolith/',be:'/be/books/monolith/',uk:'/uk/books/monolith/',de:'/de/books/monolith/',fr:'/fr/books/monolith/',es:'/es/books/monolith/',pt:'/pt/books/monolith/',fi:'/fi/books/monolith/'
      };
      var languages=(navigator.languages&&navigator.languages.length)?navigator.languages:[navigator.language||'en'];
      var target=routes.en;
      for(var i=0;i<languages.length;i+=1){
        var code=String(languages[i]).toLowerCase().split('-')[0];
        if(routes[code]){target=routes[code];break;}
      }
      window.location.replace(target);
    }());
  </script>
