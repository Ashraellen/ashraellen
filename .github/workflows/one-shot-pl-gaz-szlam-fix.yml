name: One-shot Polish GAZ SZLAM correction

on:
  push:
    paths:
      - '.github/workflows/one-shot-pl-gaz-szlam-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace visible SLUDGE with SZLAM on Polish GAZ page
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('pl/books/monolith/gas/index.html')
          s = p.read_text(encoding='utf-8')
          count = s.count('SLUDGE')
          if count != 3:
              raise SystemExit(f'Expected exactly 3 visible SLUDGE occurrences, found {count}')
          s = s.replace('SLUDGE', 'SZLAM')
          if 'SLUDGE' in s:
              raise SystemExit('SLUDGE still present after replacement')
          p.write_text(s, encoding='utf-8')
          PY
          git rm .github/workflows/one-shot-pl-gaz-szlam-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pl/books/monolith/gas/index.html
          git commit -m "Use Polish SZLAM title on GAZ page"
          git push
