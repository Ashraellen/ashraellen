name: One-shot German MONOLITH final QA

on:
  push:
    paths:
      - '.github/workflows/one-shot-de-monolith-final-qa.yml'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Final German language and technical QA
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          files=[
            Path('de/books/monolith/index.html'),
            Path('de/books/monolith/beton/index.html'),
            Path('de/books/monolith/sludge/index.html'),
            Path('de/books/monolith/gas/index.html'),
          ]
          gas=files[-1]
          s=gas.read_text(encoding='utf-8')
          fixes=[
            ('Apokryph / Nicht erfasster Fragment Nr. 0','Apokryph / Nicht erfasstes Fragment Nr. 0'),
            ('NICHT ERFASSTER FRAGMENT NR. 0','NICHT ERFASSTES FRAGMENT NR. 0'),
            ('Nicht erfassten Fragment Nr. 0 öffnen','Nicht erfasstes Fragment Nr. 0 öffnen'),
            ('der wahrnehmende Sensor beginnt','der Sensor beginnt, der es wahrnimmt'),
            ('am Hof des Mannes, den man Herr nennt — und hinter seinem Rücken Schimmel','am Hof des Mannes, den man Herr nennt — und hinter vorgehaltener Hand Schimmel'),
            ('Der Verlust einer stabilen Form ist nicht dasselbe wie Befreiung.','Der Verlust einer stabilen Form ist nicht gleichbedeutend mit Befreiung.'),
            ('eine künstlerische Erfahrung über die Position des Beobachters','eine künstlerische Erfahrung der Position des Beobachters'),
          ]
          for old,new in fixes: s=s.replace(old,new)
          gas.write_text(s,encoding='utf-8')

          # Technical invariants on all four pages.
          checks={}
          for p in files:
              t=p.read_text(encoding='utf-8')
              checks[str(p)+' lang']='<html lang="de-DE">' in t
              checks[str(p)+' mark']='— mark of presence' in t
              checks[str(p)+' no Russian cover']='-ru.webp' not in t
          series=files[0].read_text(encoding='utf-8')
          beton=files[1].read_text(encoding='utf-8')
          sludge=files[2].read_text(encoding='utf-8')
          gast=files[3].read_text(encoding='utf-8')
          checks.update({
            'series canon': all(x in series for x in ['MONOLITH','BETON','SCHLAMM','GAS']),
            'series covers': all(x in series for x in ['beton-en.webp','sludge-en.webp','GAS_EN_COVER_final_v01.webp']),
            'series gas active': 'href="https://www.ashraellen.com/de/books/monolith/gas/"' in series,
            'series hasPart gas': 'https://www.ashraellen.com/de/books/monolith/gas/#book' in series,
            'BETON Google twice': beton.count('GGKEY:6W7BCZQ9YQZ')==2,
            'BETON Amazon twice': beton.count('B0H18H1CFR')==2,
            'SCHLAMM Google twice': sludge.count('ISBN:978-5-0054-9349-4')==2,
            'SCHLAMM Amazon twice': sludge.count('B0H196VMX9')==2,
            'GAS Google twice': gast.count('NWEAEgAAQBAJ')==2,
            'GAS Amazon twice': gast.count('B0HDQDVJ7G')==2,
            'GAS registry': '15 Kapitel / 45 Abschnitte' in gast,
            'GAS fragment grammar': 'Nicht erfasstes Fragment Nr. 0' in gast and 'NICHT ERFASSTES FRAGMENT NR. 0' in gast,
          })
          for k,v in checks.items(): print(('PASS' if v else 'FAIL'),k)
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('Validation failed: '+repr(bad))
          PY
          rm -f .github/workflows/one-shot-de-monolith-final-qa.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Final-QA German MONOLITH branch'
          git push