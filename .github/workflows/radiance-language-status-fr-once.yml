name: One-time French Radiance language status update

on:
  push:
    paths:
      - '.github/workflows/radiance-language-status-fr-once.yml'

permissions:
  contents: write

jobs:
  update-radiance-status:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply approved French status transcreation
        run: |
          python - <<'PY'
          from pathlib import Path

          changes = {
              'fr/books/radiance/sampo/index.html': [
                  ('La version russe est terminée.', 'La version d’auteur est achevée.'),
                  ('Transcréation littéraire anglaise terminée.', 'La version littéraire anglaise se trouve dans la phase finale de préparation.'),
                  ('Une version finlandaise est possible comme prochaine étape partenaire.', 'La version littéraire finnoise est prévue comme prochaine étape professionnelle du projet.'),
              ],
              'fr/books/radiance/song/index.html': [
                  ('La version russe est terminée.', 'La version d’auteur est achevée.'),
                  ('La transcréation littéraire anglaise est prévue comme prochaine étape.', 'La version littéraire anglaise constitue la prochaine étape du travail.'),
                  ('Une version finlandaise est possible comme prochaine étape partenaire.', 'La version littéraire finnoise est prévue dans le cadre du développement ultérieur du projet.'),
              ],
          }

          for filename, replacements in changes.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for old, new in replacements:
                  count = text.count(old)
                  if count == 0:
                      raise SystemExit(f'Expected text not found in {filename}: {old}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Verify approved boundaries
        run: |
          python - <<'PY'
          from pathlib import Path
          sampo = Path('fr/books/radiance/sampo/index.html').read_text(encoding='utf-8')
          song = Path('fr/books/radiance/song/index.html').read_text(encoding='utf-8')

          required_sampo = [
              'La version d’auteur est achevée.',
              'La version littéraire anglaise se trouve dans la phase finale de préparation.',
              'Version polonaise en préparation.',
              'La version littéraire finnoise est prévue comme prochaine étape professionnelle du projet.',
          ]
          required_song = [
              'La version d’auteur est achevée.',
              'La version littéraire anglaise constitue la prochaine étape du travail.',
              'Version polonaise en préparation.',
              'La version littéraire finnoise est prévue dans le cadre du développement ultérieur du projet.',
              'deuxième nœud de recherche terminé',
          ]
          for needle in required_sampo:
              if needle not in sampo:
                  raise SystemExit(f'Missing Sampo text: {needle}')
          for needle in required_song:
              if needle not in song:
                  raise SystemExit(f'Missing Chant text: {needle}')

          forbidden = [
              'Transcréation littéraire anglaise terminée.',
              'La transcréation littéraire anglaise est prévue comme prochaine étape.',
          ]
          for filename, text in [('sampo', sampo), ('song', song)]:
              for needle in forbidden:
                  if needle in text:
                      raise SystemExit(f'Forbidden old status remains in {filename}: {needle}')
          PY

      - name: Commit corrected pages and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/radiance-language-status-fr-once.yml
          git add fr/books/radiance/sampo/index.html fr/books/radiance/song/index.html
          git commit -m "Update French Radiance language status"
          git push
