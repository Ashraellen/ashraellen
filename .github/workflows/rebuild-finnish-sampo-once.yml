name: One-time Finnish Sampo full reconstruction

on:
  push:
    paths:
      - '.github/workflows/rebuild-finnish-sampo-once.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify source and reconstruct
        shell: bash
        run: |
          set -euo pipefail
          expected_old='cdc4e3859cec7829be29499b23814a5f48df81f8'
          actual_old="$(git hash-object fi/books/radiance/sampo/index.html)"
          test "$actual_old" = "$expected_old"

          cat \
            .github/tmp-sampo-fi/part1.b64 \
            .github/tmp-sampo-fi/part2.b64 \
            .github/tmp-sampo-fi/part3.b64 \
            .github/tmp-sampo-fi/part4.b64 \
            > /tmp/sampo-fi.b64
          test "$(wc -c < /tmp/sampo-fi.b64 | tr -d ' ')" -eq 21628
          base64 -d /tmp/sampo-fi.b64 | gzip -d > /tmp/sampo-fi.html
          test "$(sha256sum /tmp/sampo-fi.html | awk '{print $1}')" = '80a5398ec0461f16a73bb047a9397d2a62415913c15607fa18584724ea964074'

          python3 - <<'PY'
          import re
          from pathlib import Path

          ru = Path('ru/books/radiance/sampo/index.html').read_text(encoding='utf-8')
          fi = Path('/tmp/sampo-fi.html').read_text(encoding='utf-8')

          def chapter_count(text):
              m = re.search(r'<div class="sampo-fragment-more">(.*?)<div class="sampo-chapter-return">', text, re.S)
              if not m:
                  raise SystemExit('chapter block missing')
              return len(re.findall(r'<p(?:\s[^>]*)?>', m.group(1)))

          ru_count = chapter_count(ru)
          fi_count = chapter_count(fi)
          assert ru_count == 569, ru_count
          assert fi_count == ru_count, (fi_count, ru_count)

          required = [
              'Kirjasta',
              'Ilman juonipaljastuksia',
              'Taiteellisen tutkimuksen kehys',
              'Teemat',
              'Kenelle',
              'Kieli- ja julkaisutilanne',
              'Rahastoille, kustantajille ja kulttuurikumppaneille',
              'Paikka sarjassa',
          ]
          for item in required:
              assert item in fi, item
          assert fi.count('class="sampo-status"') == 4
          assert 'Tämä suomenkielinen verkkosivu on teoksen esittelysivun transkreaatioversio' in fi
          print(f'Validated chapter parity: FI={fi_count}, RU={ru_count}')
          PY

          mv /tmp/sampo-fi.html fi/books/radiance/sampo/index.html

      - name: Commit reconstructed page and clean staging
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/tmp-sampo-fi
          rm .github/workflows/rebuild-finnish-sampo-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Rebuild Finnish Sampo page without content reduction'
          git pull --rebase origin main
          git push origin HEAD:main
