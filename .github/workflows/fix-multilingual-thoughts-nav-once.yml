name: Fix multilingual thoughts navigation once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-multilingual-thoughts-nav-once.yml'

permissions:
  contents: write

jobs:
  fix-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize multilingual thoughts navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          labels = {
              'en': ('Next arc', 'Previous arc'),
              'pl': ('Następny łuk', 'Poprzedni łuk'),
              'de': ('Nächster Bogen', 'Vorheriger Bogen'),
              'es': ('Arco siguiente', 'Arco anterior'),
              'fr': ('Arc suivant', 'Arc précédent'),
              'pt': ('Arco seguinte', 'Arco anterior'),
              'uk': ('Наступна дуга', 'Попередня дуга'),
              'be': ('Наступная дуга', 'Папярэдняя дуга'),
              'fi': ('Seuraava kaari', 'Edellinen kaari'),
          }

          def public_label(html, lang):
              pats = [
                  rf'<a[^>]+href=["\'][^"\']*/{lang}/public/?["\'][^>]*>([^<]+)</a>',
                  rf'<a[^>]+href=["\']/{lang}/public/["\'][^>]*>([^<]+)</a>',
              ]
              for pat in pats:
                  m = re.search(pat, html, re.I)
                  if m:
                      return re.sub(r'\s+', ' ', m.group(1)).strip()
              raise SystemExit(f'Cannot find public label for {lang}')

          nav_pat = re.compile(r'<div class=(["\'])nav-row\1>.*?</div>', re.S)

          for lang, (next_label, prev_label) in labels.items():
              base = Path(lang) / 'public' / 'thoughts'
              p3 = base / 'index.html'
              p2 = base / 'index-0002.html'
              p1 = base / 'index-0001.html'
              for p in (p3, p2, p1):
                  if not p.exists():
                      raise SystemExit(f'Missing {p}')

              # Arc 3 (current): Public on the left, previous/older arc on the right.
              s3 = p3.read_text()
              pub3 = public_label(s3, lang)
              q3 = "'" if "class='nav-row'" in s3 else '"'
              desired3 = (
                  f'<div class={q3}nav-row{q3}>'
                  f'<a class={q3}btn{q3} href={q3}/{lang}/public/{q3}>← {pub3}</a>'
                  f'<a class={q3}btn{q3} href={q3}index-0002.html{q3}>{prev_label} →</a>'
                  f'</div>'
              )
              s3n, n = nav_pat.subn(desired3, s3, count=1)
              if n != 1:
                  raise SystemExit(f'Arc3 nav replacement failed for {lang}')
              p3.write_text(s3n)

              # Arc 2: newer arc on the left, older arc on the right.
              s2 = p2.read_text()
              q2 = "'" if "class='nav-row'" in s2 else '"'
              if "id='prevArc'" in s2 or 'id="prevArc"' in s2:
                  desired2 = (
                      f'<div class={q2}nav-row{q2}>'
                      f'<a id={q2}prevArc{q2} class={q2}btn{q2} href={q2}#{q2}>← {next_label}</a>'
                      f'<a id={q2}nextArc{q2} class={q2}btn{q2} href={q2}#{q2}>{prev_label} →</a>'
                      f'</div>'
                  )
              else:
                  desired2 = (
                      f'<div class={q2}nav-row{q2}>'
                      f'<a class={q2}btn{q2} href={q2}/{lang}/public/thoughts/{q2}>← {next_label}</a>'
                      f'<a class={q2}btn{q2} href={q2}index-0001.html{q2}>{prev_label} →</a>'
                      f'</div>'
                  )
              s2n, n = nav_pat.subn(desired2, s2, count=1)
              if n != 1:
                  raise SystemExit(f'Arc2 nav replacement failed for {lang}')
              p2.write_text(s2n)

              # Arc 1: newer arc on the left, Public exit on the right.
              s1 = p1.read_text()
              pub1 = public_label(s1, lang)
              q1 = "'" if "class='nav-row'" in s1 else '"'
              if "id='prevArc'" in s1 or 'id="prevArc"' in s1:
                  desired1 = (
                      f'<div class={q1}nav-row{q1}>'
                      f'<a id={q1}prevArc{q1} class={q1}btn{q1} href={q1}#{q1}>← {next_label}</a>'
                      f'<a class={q1}btn{q1} href={q1}/{lang}/public/{q1}>{pub1} →</a>'
                      f'</div>'
                  )
              else:
                  desired1 = (
                      f'<div class={q1}nav-row{q1}>'
                      f'<a class={q1}btn{q1} href={q1}index-0002.html{q1}>← {next_label}</a>'
                      f'<a class={q1}btn{q1} href={q1}/{lang}/public/{q1}>{pub1} →</a>'
                      f'</div>'
                  )
              s1n, n = nav_pat.subn(desired1, s1, count=1)
              if n != 1:
                  raise SystemExit(f'Arc1 nav replacement failed for {lang}')
              p1.write_text(s1n)

              # Validation of visible order/text.
              checks = [
                  (p3, f'← {pub3}', f'{prev_label} →'),
                  (p2, f'← {next_label}', f'{prev_label} →'),
                  (p1, f'← {next_label}', f'{pub1} →'),
              ]
              for p, left, right in checks:
                  text = p.read_text()
                  m = nav_pat.search(text)
                  if not m or left not in m.group(0) or right not in m.group(0) or m.group(0).index(left) > m.group(0).index(right):
                      raise SystemExit(f'Validation failed: {p}')
              print(f'OK {lang}: {pub3} | {next_label} | {prev_label}')
          PY
      - name: Commit changes and remove one-time workflow
        run: |
          rm .github/workflows/fix-multilingual-thoughts-nav-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Ashraellen@users.noreply.github.com"
          git add en/public/thoughts pl/public/thoughts de/public/thoughts es/public/thoughts fr/public/thoughts pt/public/thoughts uk/public/thoughts be/public/thoughts fi/public/thoughts .github/workflows/fix-multilingual-thoughts-nav-once.yml
          git commit -m "Fix multilingual thoughts arc navigation logic"
          git push
