name: One-shot Polish GAZ Google Play link

on:
  push:
    paths:
      - '.github/workflows/one-shot-pl-gaz-google-play.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Polish GAZ page and remove one-shot workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('pl/books/monolith/gas/index.html')
          s = p.read_text(encoding='utf-8')
          old_top = '<div class="cta-row"><a class="btn secondary" href="https://www.amazon.com/dp/B0HDQDVJ7G" target="_blank" rel="noopener noreferrer">Wydanie angielskie na Amazon</a><a class="btn secondary" href="https://www.ashraellen.com/pl/books/monolith/">Wróć do serii</a></div>'
          new_top = '<div class="cta-row"><a class="btn" href="https://play.google.com/store/books/details?id=f2EAEgAAQBAJ" target="_blank" rel="noopener noreferrer">Czytaj po polsku w Google Play Books</a><a class="btn secondary" href="https://www.amazon.com/dp/B0HDQDVJ7G" target="_blank" rel="noopener noreferrer">Wydanie angielskie na Amazon</a><a class="btn secondary" href="https://www.ashraellen.com/pl/books/monolith/">Wróć do serii</a></div>'
          old_ed = '<div class="gas-link-box"><div class="cta-row"><a class="btn secondary" href="https://www.amazon.com/dp/B0HDQDVJ7G" target="_blank" rel="noopener noreferrer">Wydanie angielskie na Amazon</a><a class="btn secondary" href="https://www.ashraellen.com/pl/books/monolith/">Wróć do serii MONOLITH</a></div></div>'
          new_ed = '<div class="gas-link-box"><div class="cta-row"><a class="btn" href="https://play.google.com/store/books/details?id=f2EAEgAAQBAJ" target="_blank" rel="noopener noreferrer">Czytaj po polsku w Google Play Books</a><a class="btn secondary" href="https://www.amazon.com/dp/B0HDQDVJ7G" target="_blank" rel="noopener noreferrer">Wydanie angielskie na Amazon</a><a class="btn secondary" href="https://www.ashraellen.com/pl/books/monolith/">Wróć do serii MONOLITH</a></div></div>'
          if s.count(old_top) != 1 or s.count(old_ed) != 1:
              raise SystemExit('Expected Polish GAZ CTA blocks not found exactly once')
          s = s.replace(old_top, new_top).replace(old_ed, new_ed)
          p.write_text(s, encoding='utf-8')
          PY
          git rm .github/workflows/one-shot-pl-gaz-google-play.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pl/books/monolith/gas/index.html
          git commit -m "Add Polish Google Play link to GAZ page"
          git push
