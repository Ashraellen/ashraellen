name: One-shot publish English GAS

on:
  push:
    paths:
      - '.github/workflows/one-shot-publish-en-gas.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish English GAS page
        run: |
          test -f assets/covers/GAS_EN_COVER_final_v01.webp
          test ! -e en/books/monolith/gas/index.html
          mkdir -p en/books/monolith/gas
          printf '%s' '' | base64 -d | gzip -d > en/books/monolith/gas/index.html
          grep -q '<h1 class="h1">GAS</h1>' en/books/monolith/gas/index.html
          grep -q 'Chapter 15. Entry' en/books/monolith/gas/index.html
          grep -q '§ 15.3. A Name You Can Bear' en/books/monolith/gas/index.html
          test "$(grep -o 'class="gas-card registry-card"' en/books/monolith/gas/index.html | wc -l)" -eq 15
          grep -q 'UNACCOUNTED FRAGMENT No. 0' en/books/monolith/gas/index.html
          grep -q 'NWEAEgAAQBAJ' en/books/monolith/gas/index.html
          git rm .github/workflows/one-shot-publish-en-gas.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add en/books/monolith/gas/index.html
          git commit -m "Add English GAS book page"
          git push
