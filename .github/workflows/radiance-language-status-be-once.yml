name: One-time Belarusian Radiance language status update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/radiance-language-status-be-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Belarusian status text
        shell: python
        run: |
          import re
          from pathlib import Path

          def replace_one(text, pattern, repl, label):
              new, n = re.subn(pattern, repl, text, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f"Expected exactly one replacement for {label}, got {n}")
              return new

          sampo_path = Path('be/books/radiance/sampo/index.html')
          sampo = sampo_path.read_text(encoding='utf-8')
          sampo = replace_one(sampo, r'(<div class="sampo-status"><strong>RU</strong><span>).*?(</span></div>)', r'\1Аўтарская версія завершана.\2', 'Sampo RU')
          sampo = replace_one(sampo, r'(<div class="sampo-status"><strong>EN</strong><span>).*?(</span></div>)', r'\1Англійская літаратурная версія знаходзіцца на фінальным этапе падрыхтоўкі.\2', 'Sampo EN')
          sampo = replace_one(sampo, r'(<div class="sampo-status"><strong>FI</strong><span>).*?(</span></div>)', r'\1Фінская літаратурная версія плануецца як наступны прафесійны этап праекта.\2', 'Sampo FI')
          sampo = replace_one(sampo, r'(<ul class="sampo-list">\s*<li>.*?</li>)\s*<li>.*?</li>', r'\1<li>Англійская літаратурная версія знаходзіцца на фінальным этапе падрыхтоўкі.</li>', 'Sampo partner English status')
          sampo_path.write_text(sampo, encoding='utf-8')

          song_path = Path('be/books/radiance/song/index.html')
          song = song_path.read_text(encoding='utf-8')
          song = replace_one(song, r'(<div class="song-status"><strong>RU</strong><span>).*?(</span></div>)', r'\1Аўтарская версія завершана.\2', 'Song RU')
          song = replace_one(song, r'(<div class="song-status"><strong>EN</strong><span>).*?(</span></div>)', r'\1Англійская літаратурная версія — наступны этап працы.\2', 'Song EN')
          song = replace_one(song, r'(<div class="song-status"><strong>FI</strong><span>).*?(</span></div>)', r'\1Фінская літаратурная версія плануецца ў рамках далейшага развіцця праекта.\2', 'Song FI')
          song_path.write_text(song, encoding='utf-8')

      - name: Commit content update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add be/books/radiance/sampo/index.html be/books/radiance/song/index.html
          git diff --cached --quiet && { echo "No content changes"; exit 1; }
          git commit -m "Update Belarusian Radiance language status"
          git push

      - name: Remove one-time workflow
        run: |
          git pull --rebase
          git rm .github/workflows/radiance-language-status-be-once.yml
          git commit -m "Remove one-time Belarusian Radiance status workflow"
          git push
