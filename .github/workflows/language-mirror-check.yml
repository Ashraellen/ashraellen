name: Language mirror check

on:
  push:
    branches:
      - main
    paths:
      - '**/*.html'
      - 'scripts/check-language-mirrors.js'
      - '.github/workflows/language-mirror-check.yml'
  pull_request:
    branches:
      - main
    paths:
      - '**/*.html'
      - 'scripts/check-language-mirrors.js'
      - '.github/workflows/language-mirror-check.yml'
  workflow_dispatch:

jobs:
  language-mirror-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check language mirrors
        run: node scripts/check-language-mirrors.js
