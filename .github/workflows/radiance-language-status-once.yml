name: One-time Radiance language status update

on:
  push:
    paths:
      - '.github/workflows/radiance-language-status-once.yml'

permissions:
  contents: write

jobs:
  update-radiance-status:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply approved status corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          changes = {
              'ru/books/radiance/sampo/index.html': [
                  ('Русская версия завершена.', 'Авторская версия завершена.'),
                  ('Английская литературная транскреация завершена.', 'Английская литературная версия находится на финальном этапе подготовки.'),
                  ('Финская версия возможна как следующий партнёрский этап.', 'Финская литературная версия планируется как следующий профессиональный этап проекта.'),
                  ('Завершённая английская литературная транскреация.', 'Английская литературная версия находится на финальном этапе подготовки.'),
              ],
              'ru/books/radiance/song/index.html': [
                  ('Русская версия завершена.', 'Авторская версия завершена.'),
                  ('Английская литературная транскреация планируется как следующий этап.', 'Английская литературная версия — следующий этап работы.'),
                  ('Финская версия возможна как следующий партнёрский этап.', 'Финская литературная версия планируется в рамках дальнейшего развития проекта.'),
              ],
              'en/books/radiance/sampo/index.html': [
                  ('Russian version is completed.', 'Author’s version is complete.'),
                  ('English literary transcreation completed.', 'The English literary version is in the final stage of preparation.'),
                  ('Finnish version is possible as the next partner stage.', 'The Finnish literary version is planned as the next professional stage of the project.'),
                  ('Completed English literary transcreation.', 'The English literary version is in the final stage of preparation.'),
              ],
              'en/books/radiance/song/index.html': [
                  ('Russian version is completed.', 'Author’s version is complete.'),
                  ('English literary transcreation completed.', 'The English literary version is the next stage of work.'),
                  ('Finnish version is possible as the next partner stage.', 'The Finnish literary version is planned as part of the project’s further development.'),
              ],
          }

          for filename, replacements in changes.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for old, new in replacements:
                  count = text.count(old)
                  if count == 0:
                      raise SystemExit(f'Expected text not found in {filename}: {old}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Verify approved boundaries
        run: |
          python - <<'PY'
          from pathlib import Path

          files = {
              'ru_sampo': Path('ru/books/radiance/sampo/index.html').read_text(encoding='utf-8'),
              'ru_song': Path('ru/books/radiance/song/index.html').read_text(encoding='utf-8'),
              'en_sampo': Path('en/books/radiance/sampo/index.html').read_text(encoding='utf-8'),
              'en_song': Path('en/books/radiance/song/index.html').read_text(encoding='utf-8'),
          }

          required = {
              'ru_sampo': [
                  'Авторская версия завершена.',
                  'Английская литературная версия находится на финальном этапе подготовки.',
                  'Польская версия в подготовке.',
                  'Финская литературная версия планируется как следующий профессиональный этап проекта.',
              ],
              'ru_song': [
                  'Авторская версия завершена.',
                  'Английская литературная версия — следующий этап работы.',
                  'Польская версия в подготовке.',
                  'Финская литературная версия планируется в рамках дальнейшего развития проекта.',
                  '«Песня» — второй завершённый исследовательский узел «Сияния».',
              ],
              'en_sampo': [
                  'Author’s version is complete.',
                  'The English literary version is in the final stage of preparation.',
                  'Polish version in preparation.',
                  'The Finnish literary version is planned as the next professional stage of the project.',
              ],
              'en_song': [
                  'Author’s version is complete.',
                  'The English literary version is the next stage of work.',
                  'Polish version in preparation.',
                  'The Finnish literary version is planned as part of the project’s further development.',
                  'second completed research node',
              ],
          }

          for key, needles in required.items():
              for needle in needles:
                  if needle not in files[key]:
                      raise SystemExit(f'Missing required text in {key}: {needle}')

          forbidden = [
              'Английская литературная транскреация завершена.',
              'Завершённая английская литературная транскреация.',
              'English literary transcreation completed.',
              'Completed English literary transcreation.',
          ]
          for key, text in files.items():
              for needle in forbidden:
                  if needle in text:
                      raise SystemExit(f'Forbidden completed-English claim remains in {key}: {needle}')
          PY

      - name: Commit corrected pages and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/radiance-language-status-once.yml
          git add \
            ru/books/radiance/sampo/index.html \
            ru/books/radiance/song/index.html \
            en/books/radiance/sampo/index.html \
            en/books/radiance/song/index.html
          git commit -m "Update Radiance language status"
          git push
