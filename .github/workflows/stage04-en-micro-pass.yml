name: Stage 04 EN protected micro-pass

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply constrained EN protected micro-pass
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          targets = {
              'en/books/radiance/sampo/index.html': [
                  ('<p data-p="275">- And then, if you collect everything, the bowl becomes too full. Then she starts to think about where to put the excess. I don\'t like to think about unnecessary things in the morning.</p>',
                   '<p data-p="275">- And then, if you collect everything, the bowl becomes too full. Then I start to think about where to put the excess. I don\'t like to think about unnecessary things in the morning.</p>'),
              ],
              'en/books/radiance/song/index.html': [
                  ('<p data-p="180">Now it’s rougher. With less caution. Added a dry hit, almost unnecessary. Gave the lower strings more wood. Removed a nice delay. It turned out more interesting. But then a professional voice rose in her head: it would be too noticeable to the customer, Marta would ask to soften it, the sound engineer would say that it was interfering with the voice, people with money would be afraid of the drum’s ancestors.</p>',
                   '<p data-p="180">Now it’s rougher. With less caution. Added a dry hit, almost unnecessary. Gave the lower strings more wood. Removed a nice delay. It turned out more interesting. But then a professional voice rose in her head: it would be too noticeable to the customer, Martha would ask to soften it, the sound engineer would say that it was interfering with the voice, people with money would be afraid of the drum’s ancestors.</p>'),
                  ('<p data-p="218">Work. A normal request. Normal period. A normal person on the other end, who does not understand that something has shifted inside her, but hears that it has shifted. And he doesn’t go in there with a flashlight. He just asks for a sketch.</p>',
                   '<p data-p="218">Work. A normal request. Normal period. A normal person on the other end, who does not understand that something has shifted inside her, but hears that it has shifted. And she doesn’t go in there with a flashlight. She just asks for a sketch.</p>'),
                  ('an order from Marta and a refrigerator', 'an order from Martha and a refrigerator'),
                  ('answer Marta, explain to the customer', 'answer Martha, explain to the customer'),
              ],
          }

          for path, replacements in targets.items():
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              original = text
              hits = []
              for old, new in replacements:
                  if old in text:
                      text = text.replace(old, new)
                      hits.append(old[:120])
                  else:
                      print(f'MISSING expected text in {path}: {old[:120]}')
              if text != original:
                  p.write_text(text, encoding='utf-8')
              print(f'{path}: {"changed" if text != original else "unchanged"}; replacements={len(hits)}')
              for h in hits:
                  print('  -', h)

          expected = {
              'en/books/radiance/sampo/index.html': 569,
              'en/books/radiance/song/index.html': 351,
          }
          for path, exp in expected.items():
              text = Path(path).read_text(encoding='utf-8')
              nums = [int(n) for n in re.findall(r'data-p="(\d+)"', text)]
              if len(nums) != exp or nums != list(range(1, exp + 1)):
                  raise SystemExit(f'{path}: bad data-p sequence/count: {len(nums)} expected {exp}')
              print(path, 'data-p OK', exp)

          # fail if the exact controller-blocked residues remain
          checks = [
              ('en/books/radiance/sampo/index.html', 'Then she starts to think about where to put the excess.'),
              ('en/books/radiance/song/index.html', 'And he doesn’t go in there with a flashlight. He just asks for a sketch.'),
              ('en/books/radiance/song/index.html', 'Marta would ask to soften it'),
              ('en/books/radiance/song/index.html', 'an order from Marta'),
              ('en/books/radiance/song/index.html', 'answer Marta, explain'),
          ]
          for path, needle in checks:
              if needle in Path(path).read_text(encoding='utf-8'):
                  raise SystemExit(f'Residue remains in {path}: {needle}')
          PY
      - name: Commit EN micro-pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status --short
          if ! git diff --quiet; then
            git add en/books/radiance/sampo/index.html en/books/radiance/song/index.html
            git commit -m "Stage 04: final EN protected micro-pass"
            git push
          else
            echo "No EN micro-pass changes"
          fi
