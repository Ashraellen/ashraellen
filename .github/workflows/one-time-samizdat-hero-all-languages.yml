name: One-time samizdat hero image update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-samizdat-hero-all-languages.yml'

permissions:
  contents: write

jobs:
  update-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Insert localized hero images
        run: |
          python3 - <<'PY'
          from pathlib import Path

          alts = {
              'be': 'Аўтарскае выданне samizdat 2.0 на пісьмовым стале',
              'de': 'Autorenausgabe samizdat 2.0 auf einem Schreibtisch',
              'es': 'Edición de autor samizdat 2.0 sobre un escritorio',
              'fr': 'Édition d’auteur samizdat 2.0 sur un bureau',
              'pl': 'Autorskie wydanie samizdat 2.0 na biurku',
              'pt': 'Edição de autor samizdat 2.0 sobre uma secretária',
              'uk': 'Авторське видання samizdat 2.0 на письмовому столі',
          }

          for lang, alt in alts.items():
              path = Path(lang) / 'books' / 'samizdat' / 'index.html'
              text = path.read_text(encoding='utf-8')
              text = text.replace('samizdat-en.css?v=20260728-4', 'samizdat-en.css?v=20260729-1', 1)
              if 'class="hero-edition"' in text:
                  continue
              needle = '</p><h1 id="samizdat-title">'
              image = (
                  '</p><figure class="hero-edition">'
                  '<img src="../../../assets/backgrounds/samizdat-2-0-author-edition-on-writing-desk.webp" '
                  f'alt="{alt}" width="1672" height="941">'
                  '</figure><h1 id="samizdat-title">'
              )
              if needle not in text:
                  raise RuntimeError(f'Hero insertion point not found: {path}')
              path.write_text(text.replace(needle, image, 1), encoding='utf-8')
          PY
      - name: Remove one-time workflow and commit result
        run: |
          rm .github/workflows/one-time-samizdat-hero-all-languages.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add be/books/samizdat/index.html de/books/samizdat/index.html es/books/samizdat/index.html fr/books/samizdat/index.html pl/books/samizdat/index.html pt/books/samizdat/index.html uk/books/samizdat/index.html .github/workflows/one-time-samizdat-hero-all-languages.yml
          git commit -m "Samizdat: add hero image to all remaining languages"
          git push
