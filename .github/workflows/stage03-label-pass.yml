name: Stage 03 label editorial pass

on:
  push:
    paths:
      - '.github/workflows/stage03-label-pass.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .stage03_label_pass.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add en/books/monolith pl/books/monolith be/books/monolith uk/books/monolith de/books/monolith fr/books/monolith es/books/monolith pt/books/monolith
          git diff --cached --quiet && exit 0
          git commit -m "Stage 03: complete native-label editorial pass"
          git push
