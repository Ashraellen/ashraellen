name: Add FI to language home selectors once

on:
  push:
    paths:
      - '.github/workflows/add-fi-home-language-once.yml'

permissions:
  contents: write

jobs:
  patch-language-homes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add Finnish to home language selectors and metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          langs = ['en','ru','be','pl','de','fr','es','pt','uk']

          for lang in langs:
              p = Path(lang) / 'index.html'
              s = p.read_text(encoding='utf-8')

              # Visible language row: current-language pages omit themselves; FI should be offered on all non-FI homes.
              def patch_langs(m):
                  block = m.group(0)
                  if '../fi/' in block:
                      return block
                  close = block.rfind('</div>')
                  if close == -1:
                      return block
                  # Preserve multiline/compact local formatting; append Suomi as the last offered language.
                  if '\n' in block:
                      indent_match = re.search(r'\n(\s*)<a[^>]+>[^<]+</a>\s*</div>\s*$', block)
                      indent = indent_match.group(1) if indent_match else '          '
                      insertion = f'\n{indent}<a href="../fi/">Suomi</a>'
                  else:
                      insertion = '<a href="../fi/">Suomi</a>'
                  return block[:close] + insertion + block[close:]

              s, n = re.subn(r'<div class="langs">.*?</div>', patch_langs, s, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f'Could not locate visible language row in {p}')

              # hreflang FI on language homes.
              if 'hreflang="fi"' not in s:
                  marker = '<link rel="alternate" hreflang="x-default"'
                  pos = s.find(marker)
                  if pos == -1:
                      raise SystemExit(f'Could not locate x-default hreflang in {p}')
                  s = s[:pos] + '  <link rel="alternate" hreflang="fi" href="https://www.ashraellen.com/fi/">\n' + s[pos:]

              # Add fi to the WebSite inLanguage array without changing the page-level inLanguage.
              ws = re.search(r'("@type"\s*:\s*"WebSite".*?"inLanguage"\s*:\s*\[)(.*?)(\])', s, flags=re.S)
              if not ws:
                  raise SystemExit(f'Could not locate WebSite inLanguage array in {p}')
              body = ws.group(2)
              if not re.search(r'"fi"', body):
                  trimmed = body.rstrip()
                  trailing = body[len(trimmed):]
                  if trimmed.strip():
                      # Respect whether the array is multiline or compact.
                      if '\n' in body:
                          comma = '' if trimmed.rstrip().endswith(',') else ','
                          indent_m = re.search(r'\n(\s*)"[^"\n]+"\s*,?\s*$', trimmed)
                          indent = indent_m.group(1) if indent_m else '        '
                          new_body = trimmed + comma + f'\n{indent}"fi"' + trailing
                      else:
                          comma = '' if trimmed.rstrip().endswith(',') else ','
                          new_body = trimmed + comma + '"fi"' + trailing
                  else:
                      new_body = '"fi"'
                  s = s[:ws.start(2)] + new_body + s[ws.end(2):]

              p.write_text(s, encoding='utf-8')
          PY
      - name: Verify FI selector presence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          langs = ['en','ru','be','pl','de','fr','es','pt','uk']
          for lang in langs:
              s = (Path(lang)/'index.html').read_text(encoding='utf-8')
              assert '<a href="../fi/">Suomi</a>' in s, lang
              assert 'hreflang="fi"' in s, lang
              print(f'{lang}: OK')
          PY
      - name: Commit home selector update
        run: |
          if git diff --quiet -- en/index.html ru/index.html be/index.html pl/index.html de/index.html fr/index.html es/index.html pt/index.html uk/index.html; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add en/index.html ru/index.html be/index.html pl/index.html de/index.html fr/index.html es/index.html pt/index.html uk/index.html
          git commit -m 'Add Finnish to all language home selectors'
          git push
