name: One-shot create English GAS page

on:
  push:
    paths:
      - '.github/workflows/one-shot-create-en-gas-page.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create English GAS page
        run: |
          test -f assets/covers/GAS_EN_COVER_final_v01.webp
          test ! -e en/books/monolith/gas/index.html
          mkdir -p en/books/monolith/gas
          cat > /tmp/en-gas.html.b64 <<'B64'

B64
          base64 -d /tmp/en-gas.html.b64 | gzip -d > en/books/monolith/gas/index.html
          grep -q '<h1 class="h1">GAS</h1>' en/books/monolith/gas/index.html
          grep -q 'Chapter 15. Entry' en/books/monolith/gas/index.html
          grep -q 'UNACCOUNTED FRAGMENT No. 0' en/books/monolith/gas/index.html
          grep -q 'NWEAEgAAQBAJ' en/books/monolith/gas/index.html
          git rm .github/workflows/one-shot-create-en-gas-page.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add en/books/monolith/gas/index.html
          git commit -m "Add English GAS book page"
          git push
