name: One-shot Ukrainian MONOLITH and GAS
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/one-shot-uk-monolith-gas.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Write Ukrainian pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p uk/books/monolith/gas
          cat > /tmp/uk_monolith.b64 <<'EOF_MON'

EOF_MON
          cat > /tmp/uk_gas.b64 <<'EOF_GAS'
[... ELLIPSIZATION ...]
EOF_GAS
          base64 -d /tmp/uk_monolith.b64 | gzip -d > uk/books/monolith/index.html
          base64 -d /tmp/uk_gas.b64 | gzip -d > uk/books/monolith/gas/index.html
          rm -f .github/workflows/one-shot-uk-monolith-gas.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uk/books/monolith/index.html uk/books/monolith/gas/index.html .github/workflows/one-shot-uk-monolith-gas.yml
          git commit -m 'Add Ukrainian MONOLITH and GAS pages'
          git push
