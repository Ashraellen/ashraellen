name: One-time Finnish Laulu full reconstruction

on:
  push:
    paths:
      - '.github/workflows/rebuild-finnish-laulu-once.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify source and reconstruct
        shell: bash
        run: |
          set -euo pipefail
          expected_old='8854dcf43ef2d58751c3e1ad1a36bd5c6f0c6b20'
          actual_old="$(git hash-object fi/books/radiance/song/index.html)"
          test "$actual_old" = "$expected_old"

          cat \
            .github/tmp-laulu-fi/part1.b64 \
            .github/tmp-laulu-fi/part2.b64 \
            .github/tmp-laulu-fi/part3.b64 \
            .github/tmp-laulu-fi/part4.b64 \
            .github/tmp-laulu-fi/part5.b64 \
            > /tmp/laulu-fi.b64
          test "$(wc -c < /tmp/laulu-fi.b64 | tr -d ' ')" -eq 25676
          base64 -d /tmp/laulu-fi.b64 | gzip -d > /tmp/laulu-fi.html
          test "$(sha256sum /tmp/laulu-fi.html | awk '{print $1}')" = '787d261edd10d5385527532777073bdc3413868489712c6a0f4adc80fc90705d'

          python3 - <<'PY'
          import re
          from pathlib import Path

          ru = Path('ru/books/radiance/song/index.html').read_text(encoding='utf-8')
          fi = Path('/tmp/laulu-fi.html').read_text(encoding='utf-8')

          def chapter_count(text):
              m = re.search(r'<div class="song-fragment-more">(.*?)<div class="song-chapter-return">', text, re.S)
              if not m:
                  raise SystemExit('chapter block missing')
              return len(re.findall(r'<p(?:\s[^>]*)?>', m.group(1)))

          ru_count = chapter_count(ru)
          fi_count = chapter_count(fi)
          assert ru_count == 351, ru_count
          assert fi_count == ru_count, (fi_count, ru_count)

          required = [
              'Kirjasta',
              'Ilman juonipaljastuksia',
              'Taiteellisen tutkimuksen kehys',
              'Teemat',
              'Kenelle',
              'Kieli- ja julkaisutilanne',
              'Rahastoille, kustantajille ja kulttuurikumppaneille',
              'Paikka sarjassa',
          ]
          for item in required:
              assert item in fi, item
          assert fi.count('class="song-status"') == 4
          assert 'Tämä suomenkielinen verkkosivu on teoksen julkisen esittelysivun transkreaatioversio' in fi
          assert 'toinen valmis tutkimussolmu' in fi
          print(f'Validated chapter parity: FI={fi_count}, RU={ru_count}')
          PY

          mv /tmp/laulu-fi.html fi/books/radiance/song/index.html

      - name: Commit reconstructed page and clean staging
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/tmp-laulu-fi
          rm .github/workflows/rebuild-finnish-laulu-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Rebuild Finnish Laulu page without content reduction'
          git pull --rebase origin main
          git push origin HEAD:main
