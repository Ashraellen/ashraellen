name: Apply audit fixes 2026-08

on:
  push:
    branches:
      - audit-fixes-2026-08
    paths:
      - '.audit/**'
      - '.github/workflows/apply-audit-fixes-2026-08.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and verify patch
        shell: bash
        run: |
          cat .audit/patch.b64.* > /tmp/audit.patch.gz.b64
          base64 -d /tmp/audit.patch.gz.b64 | gzip -d > /tmp/audit.patch
          git apply --check /tmp/audit.patch
      - name: Apply patch and commit
        shell: bash
        run: |
          git apply /tmp/audit.patch
          rm -rf .audit
          rm -f .github/workflows/apply-audit-fixes-2026-08.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Audit fixes: strip language-suffix titles, missing CSS links, remove JS text/link patches, dead code, translate research/notes+position'
          git push origin HEAD:audit-fixes-2026-08
