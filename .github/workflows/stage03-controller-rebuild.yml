name: Stage 03 controller rebuild

on:
  push:
    paths:
      - '.github/workflows/stage03-controller-rebuild.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild and validate all Stage 03 pages
        run: python .stage03_work/stage03_patch.py
      - name: Print validation snapshot
        run: cat Projects/WEBSITE_BOOKS_SYNC/STAGE_03_MONOLITH/VALIDATION_SNAPSHOT.json
      - name: Remove temporary build inputs
        run: |
          rm -rf .stage03_work .stage03_tmp
          rm -f .github/workflows/stage03-source-extract.yml
          rm -f .github/workflows/stage03-controller-rebuild.yml
          rm -f Projects/WEBSITE_BOOKS_SYNC/STAGE_03_MONOLITH/VALIDATION_SNAPSHOT.json
          rmdir Projects/WEBSITE_BOOKS_SYNC/STAGE_03_MONOLITH 2>/dev/null || true
          rmdir Projects/WEBSITE_BOOKS_SYNC 2>/dev/null || true
          rmdir Projects 2>/dev/null || true
      - name: Commit rebuilt pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Stage 03: rebuild MONOLITH pages after controller review"
          git push
