name: Add Ukrainian project card

on:
  push:
    paths:
      - '.github/workflows/add-uk-project-card.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Insert static HTML card
        shell: python
        run: |
          from pathlib import Path

          path = Path('uk/public/index.html')
          text = path.read_text(encoding='utf-8')
          old = "<section class='card'><h2>Публікації</h2><p>Тексти, що вийшли з лабораторії й стали повідомленням: опорні думки, фрагменти, реакції та спостереження.</p><a id='goPosts' href='posts/'>Відкрити →</a></section></div>"
          new = "<section class='card'><h2>Публікації</h2><p>Тексти, що вийшли з лабораторії й стали повідомленням: опорні думки, фрагменти, реакції та спостереження.</p><a id='goPosts' href='posts/'>Відкрити →</a></section><section class='card'><h2>Проєкти</h2><p>Дослідницькі, літературні та медійні проєкти Ashraellen — окремі поля роботи, зібрані в одному просторі.</p><a href='https://www.ashraellen.com/uk/research/projects/'>Відкрити →</a></section></div>"
          if old not in text:
              raise SystemExit('Target HTML fragment not found')
          updated = text.replace(old, new, 1)
          if updated.count('<h2>Проєкти</h2>') != 1:
              raise SystemExit('Unexpected project card count')
          path.write_text(updated, encoding='utf-8')
          Path('.github/workflows/add-uk-project-card.yml').unlink()
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uk/public/index.html .github/workflows/add-uk-project-card.yml
          git commit -m "Add Ukrainian projects card"
          git push
