            ('p','He wanted to say something correct. Something noble. For example: “Thy will be done.” Or: “Teach me to accept.” Or: “Show me the way.”'),
            ('p','But something completely different rose inside.'),('p','Not a prayer.'),('p','Rather an application.'),('p','Not even an application — a claim.'),
            ('p','And the longer he remained silent, the more clearly he understood: if he began to speak beautifully now, he would lie from the first word. And he was tired of lying. Especially toward the place where, in theory, everything is visible anyway.'),
