            ('p','Vlad did not know a single prayer completely. He had heard something in childhood. Later he had seen some in films. Then he had been in church a couple of times, where everyone around him confidently made movements whose meaning was approximately as clear to him as the settings of an industrial machine in Japanese.'),
            ('p','He crossed himself.'),('p','Awkwardly.'),('p','Too quickly.'),('p','Then once more, more slowly, so it would not look entirely like the gesture of a desperate user before a frozen computer.'),
