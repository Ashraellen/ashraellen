            ('p','Vlad looked at the cross.'),('p','Then at the bills.'),('p','Then back at the cross.'),('p','The cross looked more honest.'),('p','The bills did too, but in another sense.'),
            ('p','He sighed and ran his palm over his face. The face was tired. Not old, not broken, not tragic — simply the face of a person who had explained to himself for too long that everything was going normally and had finally stopped believing himself.'),
            ('p','“Well,” he said into the emptiness. “Let’s do this like adults.”'),
