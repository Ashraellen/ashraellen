name: One-shot Portuguese MONOLITO rollout

on:
  push:
    paths:
      - '.github/workflows/one-shot-pt-monolito-rollout.yml'

permissions:
  contents: write

jobs:
  rollout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update Portuguese series, BETAO and LAMA
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          series=Path('pt/books/monolith/index.html')
          beton=Path('pt/books/monolith/beton/index.html')
          lama=Path('pt/books/monolith/sludge/index.html')

          # Canonical visible Portuguese titles. Technical lowercase routes are intentionally untouched.
          for p in [series,beton,lama]:
              s=p.read_text(encoding='utf-8')
              for old,new in [('MONOLITH','MONÓLITO'),('BETON','BETÃO'),('SLUDGE','LAMA'),('GAS','GÁS')]:
                  s=s.replace(old,new)
              # European Portuguese public-language cleanup for common legacy BR forms.
              s=s.replace('controle','controlo').replace('Controle','Controlo')
              s=s.replace('Pesquisa','Investigação').replace('pesquisa','investigação')
              s=s.replace('se torna','torna-se').replace('se tornam','tornam-se')
              s=s.replace('café da manhã','pequeno-almoço').replace('Café da manhã','Pequeno-almoço')
              s=s.replace('ônibus','autocarro').replace('Ônibus','Autocarro')
              s=s.replace('equipe','equipa').replace('Equipe','Equipa')
              s=s.replace('usuário','utilizador').replace('Usuário','Utilizador')
              p.write_text(s,encoding='utf-8')

          # Series page: English covers and active Volume III.
          s=series.read_text(encoding='utf-8')
          s=s.replace('../../../assets/covers/beton-ru.webp','../../../assets/covers/beton-en.webp')
          s=s.replace('../../../assets/covers/sludge-ru.webp','../../../assets/covers/sludge-en.webp')
          s=s.replace('Capa russa de BETÃO','Capa inglesa de BETÃO')
          s=s.replace('Capa russa de LAMA','Capa inglesa de LAMA')
          placeholder='<div class="cover placeholder">GÁS</div><h3>Volume III — GÁS</h3><p>Descompressão final. O sentido começa a espalhar-se onde a forma anterior já não consegue conter a pressão.</p><span class="btn secondary">Em preparação</span>'
          active='<div class="cover"><img src="../../../assets/covers/GAS_EN_COVER_final_v01.webp" alt="Capa inglesa de GÁS" loading="lazy"></div><h3>Volume III — GÁS</h3><p>Descompressão final. O sentido começa a espalhar-se onde a forma anterior já não consegue conter a pressão.</p><a class="btn" href="https://www.ashraellen.com/pt/books/monolith/gas/">Abrir volume</a>'
          if placeholder in s:
              s=s.replace(placeholder,active)
          else:
              # tolerate legacy wording before pt-PT cleanup
              import re
              s=re.sub(r'<div class="cover placeholder">GÁS</div><h3>Volume III — GÁS</h3><p>.*?</p><span class="btn secondary">.*?</span>',active,s,count=1,flags=re.S)
          marker='{"@id":"https://www.ashraellen.com/pt/books/monolith/sludge/#book"}]'
          if marker in s:
              s=s.replace(marker,'{"@id":"https://www.ashraellen.com/pt/books/monolith/sludge/#book"},{"@id":"https://www.ashraellen.com/pt/books/monolith/gas/#book"}]')
          series.write_text(s,encoding='utf-8')

          # BETÃO: English cover + English Google Play/Amazon reading editions in both link groups.
          s=beton.read_text(encoding='utf-8')
          s=s.replace('../../../../assets/covers/beton-ru.webp','../../../../assets/covers/beton-en.webp')
          s=s.replace('https://www.ashraellen.com/assets/covers/beton-ru.webp','https://www.ashraellen.com/assets/covers/beton-en.webp')
          s=s.replace('Capa russa de BETÃO','Capa inglesa de BETÃO')
          s=s.replace('https://play.google.com/store/books/details?id=S__VEQAAQBAJ','https://play.google.com/store/books/details/Savva_Libegotski_BETON?id=GGKEY:6W7BCZQ9YQZ')
          s=s.replace('Ler a edição russa no Google Play Books','Ler a edição inglesa no Google Play Books')
          s=s.replace('Edição russa no Google Play Books','Edição inglesa no Google Play Books')
          s=s.replace('Voltar a MONÓLITO','Voltar ao MONÓLITO')
          beton.write_text(s,encoding='utf-8')

          # LAMA: English cover + English Google Play/Amazon reading editions in both link groups.
          s=lama.read_text(encoding='utf-8')
          s=s.replace('../../../../assets/covers/sludge-ru.webp','../../../../assets/covers/sludge-en.webp')
          s=s.replace('https://www.ashraellen.com/assets/covers/sludge-ru.webp','https://www.ashraellen.com/assets/covers/sludge-en.webp')
          s=s.replace('Capa russa de LAMA','Capa inglesa de LAMA')
          s=s.replace('https://play.google.com/store/books/details/Ashraellen_%D0%96%D0%98%D0%96%D0%90?id=-bzWEQAAQBAJ','https://play.google.com/store/books/details/Savva_Libegotski/SLUDGE?id=ISBN:978-5-0054-9349-4')
          s=s.replace('Ler a edição russa no Google Play Books','Ler a edição inglesa no Google Play Books')
          s=s.replace('Edição russa no Google Play Books','Edição inglesa no Google Play Books')
          s=s.replace('Voltar a MONÓLITO','Voltar ao MONÓLITO')
          lama.write_text(s,encoding='utf-8')

          # Defensive checks.
          checks={
            'series canon': all(x in series.read_text(encoding='utf-8') for x in ['MONÓLITO','BETÃO','LAMA','GÁS']),
            'series English covers': all(x in series.read_text(encoding='utf-8') for x in ['beton-en.webp','sludge-en.webp','GAS_EN_COVER_final_v01.webp']),
            'series GAS active': '/pt/books/monolith/gas/' in series.read_text(encoding='utf-8'),
            'BETAO English cover': 'beton-en.webp' in beton.read_text(encoding='utf-8'),
            'BETAO English Google twice': beton.read_text(encoding='utf-8').count('GGKEY:6W7BCZQ9YQZ') == 2,
            'LAMA English cover': 'sludge-en.webp' in lama.read_text(encoding='utf-8'),
            'LAMA English Google twice': lama.read_text(encoding='utf-8').count('ISBN:978-5-0054-9349-4') == 2,
            'mark invariant series': '— mark of presence' in series.read_text(encoding='utf-8'),
            'mark invariant BETAO': '— mark of presence' in beton.read_text(encoding='utf-8'),
            'mark invariant LAMA': '— mark of presence' in lama.read_text(encoding='utf-8'),
          }
          for k,v in checks.items(): print(('PASS' if v else 'FAIL'),k)
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('Validation failed: '+', '.join(bad))
          PY
          rm -f .github/workflows/one-shot-pt-monolito-rollout.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Roll out Portuguese MONOLITO canon and English editions'
          git push