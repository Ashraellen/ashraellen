name: Stage 03 direct Russian clean delivery

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  revise-and-deliver:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout isolated revision branch
        uses: actions/checkout@v4
        with:
          ref: stage03-revision-work
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Rebuild and validate all 24 targets directly from Russian
        run: python tools/stage03_direct_ru.py

      - name: Create a clean content-only commit on current main
        shell: bash
        run: |
          set -euo pipefail
          expected_main="c830f241b75e07bcfa44184dd69dbc6761b37e4d"
          git fetch origin main
          actual_main="$(git rev-parse origin/main)"
          if [ "$actual_main" != "$expected_main" ]; then
            echo "Main moved unexpectedly: $actual_main"
            exit 1
          fi

          rm -rf /tmp/stage03-pages
          mkdir -p /tmp/stage03-pages
          for lang in en pl be uk de fr es pt; do
            for rel in \
              "$lang/books/monolith/index.html" \
              "$lang/books/monolith/beton/index.html" \
              "$lang/books/monolith/sludge/index.html"; do
              mkdir -p "/tmp/stage03-pages/$(dirname "$rel")"
              cp "$rel" "/tmp/stage03-pages/$rel"
            done
          done

          git reset --hard origin/main
          cp -a /tmp/stage03-pages/. .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for lang in en pl be uk de fr es pt; do
            git add "$lang/books/monolith/index.html"
            git add "$lang/books/monolith/beton/index.html"
            git add "$lang/books/monolith/sludge/index.html"
          done

          python - <<'PY'
          import re
          import subprocess
          changed = subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only'], text=True
          ).splitlines()
          allowed = re.compile(
              r'^(?:en|pl|be|uk|de|fr|es|pt)/books/monolith/(?:index\.html|beton/index\.html|sludge/index\.html)$'
          )
          unexpected = [path for path in changed if not allowed.match(path)]
          if unexpected:
              raise SystemExit(f'Unexpected staged paths: {unexpected}')
          if len(changed) != 24:
              raise SystemExit(f'Expected exactly 24 Stage 03 HTML files, got {len(changed)}: {changed}')
          print('CLEAN_SCOPE_PASS: exactly 24 authorized Stage 03 HTML files')
          PY

          git commit -m "Stage 03 revision: rebuild MONOLITH directly from Russian"
          git push origin HEAD:main
