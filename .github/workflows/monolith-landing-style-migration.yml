name: MONOLITH landing style migration

on:
  push:
    paths:
      - '.github/workflows/monolith-landing-style-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Migrate MONOLITH landing pages to one CSS
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          langs = ('en','ru','pl','be','uk','de','fr','es','pt')
          css_link = '<link rel="stylesheet" href="../../../assets/books-monolith.css?v=20260813-2">'

          for lang in langs:
              path = Path(lang) / 'books' / 'monolith' / 'index.html'
              if not path.exists():
                  raise SystemExit(f'Missing expected MONOLITH landing: {path}')

              text = path.read_text(encoding='utf-8')
              canonical = f'https://www.ashraellen.com/{lang}/books/monolith/'
              if f'<link rel="canonical" href="{canonical}">' not in text:
                  raise SystemExit(f'Unexpected canonical in {path}')

              # This page type owns its stylesheet directly; books.css belongs only to /xx/books/.
              text, n_link = re.subn(
                  r'<link\s+rel="stylesheet"\s+href="\.\./\.\./\.\./assets/books\.css[^\"]*">',
                  css_link,
                  text,
                  count=1,
              )
              if n_link != 1:
                  raise SystemExit(f'Expected exactly one books.css link in {path}, found {n_link}')

              # Presentation belongs exclusively in assets/books-monolith.css.
              text = re.sub(r'<style\b[^>]*>.*?</style>', '', text, flags=re.I | re.S)
              text = re.sub(r'\s+style\s*=\s*"[^"]*"', '', text, flags=re.I)
              text = re.sub(r"\s+style\s*=\s*'[^']*'", '', text, flags=re.I)

              if 'assets/books.css' in text:
                  raise SystemExit(f'books.css still referenced by {path}')
              if re.search(r'<style\b', text, flags=re.I):
                  raise SystemExit(f'Inline style block remains in {path}')
              if re.search(r'\sstyle\s*=', text, flags=re.I):
                  raise SystemExit(f'Inline style attribute remains in {path}')
              if 'assets/books-monolith.css' not in text:
                  raise SystemExit(f'MONOLITH stylesheet missing in {path}')

              path.write_text(text, encoding='utf-8')
          PY

      - name: Verify migration scope
        shell: bash
        run: |
          git diff --exit-code -- assets/books.css assets/books-monolith.css || true
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              en/books/monolith/index.html|ru/books/monolith/index.html|pl/books/monolith/index.html|be/books/monolith/index.html|uk/books/monolith/index.html|de/books/monolith/index.html|fr/books/monolith/index.html|es/books/monolith/index.html|pt/books/monolith/index.html) ;;
              *) echo "Unexpected changed file: $f" >&2; exit 1 ;;
            esac
          done <<< "$changed"

      - name: Commit migration
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No migration changes needed.'
            exit 0
          fi
          git config user.name 'Ashraellen'
          git config user.email 'ashraellen@gmail.com'
          git add en/books/monolith/index.html ru/books/monolith/index.html pl/books/monolith/index.html be/books/monolith/index.html uk/books/monolith/index.html de/books/monolith/index.html fr/books/monolith/index.html es/books/monolith/index.html pt/books/monolith/index.html
          git commit -m 'Unify MONOLITH landing pages under one CSS'
          git push origin HEAD:main
