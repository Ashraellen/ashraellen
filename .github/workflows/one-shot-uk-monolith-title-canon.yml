name: One-shot Ukrainian MONOLITH title canon

on:
  push:
    paths:
      - '.github/workflows/one-shot-uk-monolith-title-canon.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace visible English title canon on Ukrainian BETON and SLUDGE pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          targets = [
              Path('uk/books/monolith/beton/index.html'),
              Path('uk/books/monolith/sludge/index.html'),
          ]
          replacements = {
              'MONOLITH': 'МОНОЛІТ',
              'BETON': 'БЕТОН',
              'SLUDGE': 'ЖИЖА',
              'GAS': 'ГАЗ',
          }
          for p in targets:
              s = p.read_text(encoding='utf-8')
              before = {k: s.count(k) for k in replacements}
              for old, new in replacements.items():
                  s = s.replace(old, new)
              p.write_text(s, encoding='utf-8')
              after = {k: s.count(k) for k in replacements}
              print(p, 'before=', before, 'after=', after)
              if any(after.values()):
                  raise SystemExit(f'English title canon remains in {p}: {after}')
          PY
          rm -f .github/workflows/one-shot-uk-monolith-title-canon.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use Ukrainian MONOLITH volume titles on Ukrainian book pages'
          git push
