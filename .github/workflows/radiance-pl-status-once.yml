name: One-time Polish Radiance status update

on:
  push:
    paths:
      - '.github/workflows/radiance-pl-status-once.yml'

permissions:
  contents: write

jobs:
  update-radiance-pl-status:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply Polish transcreated status corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          changes = {
              'pl/books/radiance/sampo/index.html': [
                  ('Wersja rosyjska została ukończona.', 'Wersja autorska jest ukończona.'),
                  ('Zakończono transkreację literacką na język angielski.', 'Angielska wersja literacka znajduje się na końcowym etapie przygotowania.'),
                  ('Wersja fińska jest możliwa jako kolejny etap partnerski.', 'Fińska wersja literacka jest planowana jako kolejny profesjonalny etap projektu.'),
              ],
              'pl/books/radiance/song/index.html': [
                  ('Wersja rosyjska została ukończona.', 'Wersja autorska jest ukończona.'),
                  ('Kolejnym etapem planowana jest angielska transkreacja literacka.', 'Angielska wersja literacka jest kolejnym etapem pracy.'),
                  ('Wersja fińska jest możliwa jako kolejny etap partnerski.', 'Fińska wersja literacka jest planowana w ramach dalszego rozwoju projektu.'),
              ],
          }

          for filename, replacements in changes.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'Expected text not found in {filename}: {old}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Verify Polish status boundaries
        run: |
          python - <<'PY'
          from pathlib import Path
          sampo = Path('pl/books/radiance/sampo/index.html').read_text(encoding='utf-8')
          song = Path('pl/books/radiance/song/index.html').read_text(encoding='utf-8')

          required_sampo = [
              'Wersja autorska jest ukończona.',
              'Angielska wersja literacka znajduje się na końcowym etapie przygotowania.',
              'Wersja polska w przygotowaniu.',
              'Fińska wersja literacka jest planowana jako kolejny profesjonalny etap projektu.',
          ]
          required_song = [
              'Wersja autorska jest ukończona.',
              'Angielska wersja literacka jest kolejnym etapem pracy.',
              'Wersja polska w przygotowaniu.',
              'Fińska wersja literacka jest planowana w ramach dalszego rozwoju projektu.',
              '„Pieśń” to drugi ukończony węzeł badawczy „Blask”.',
          ]
          for needle in required_sampo:
              if needle not in sampo:
                  raise SystemExit(f'Missing in Sampo: {needle}')
          for needle in required_song:
              if needle not in song:
                  raise SystemExit(f'Missing in Song: {needle}')
          forbidden = [
              'Zakończono transkreację literacką na język angielski.',
              'Kolejnym etapem planowana jest angielska transkreacja literacka.',
          ]
          for text in (sampo, song):
              for needle in forbidden:
                  if needle in text:
                      raise SystemExit(f'Old status remains: {needle}')
          PY

      - name: Commit corrected Polish pages and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/radiance-pl-status-once.yml
          git add pl/books/radiance/sampo/index.html pl/books/radiance/song/index.html
          git commit -m "Update Polish Radiance language status"
          git push
