name: Stage 04 Radiance transfer

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: stage04-radiance-transfer
  cancel-in-progress: true

jobs:
  transfer:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage04-radiance-transfer
          fetch-depth: 0

      - name: Download completed Stage 04 artifacts
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/stage04-artifacts
          cat > /tmp/stage04-artifacts/urls.tsv <<'EOF'
          be	https://sdmntprnortheu.oaiusercontent.com/files/00000000-49e0-71f4-b430-4807f9495a79/raw?se=2026-07-08T07:05:28Z&sp=r&sv=2026-02-06&sr=b&scid=8c1ff676-d12b-53c4-8026-76e4832d1d33&skoid=5bfb38a5-43fb-4c63-80a1-6ae1e97e2e16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-08T06:15:16Z&ske=2026-07-10T06:15:16Z&sks=b&skv=2026-02-06&sig=qGX8RkA1VCxYEtENZJNjYMRIl85kvQ8uGek3Sb2Axxo%3D
          en	https://sdmntprnortheu.oaiusercontent.com/files/00000000-ee28-71f4-b4c8-770d47d831d4/raw?se=2026-07-08T07:05:38Z&sp=r&sv=2026-02-06&sr=b&scid=67f48c28-662b-508d-a828-4a2e8364e213&skoid=5bfb38a5-43fb-4c63-80a1-6ae1e97e2e16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-08T04:37:27Z&ske=2026-07-10T04:37:27Z&sks=b&skv=2026-02-06&sig=pxUhSS%2BlasEygwzx4ZXG3Mi9jFDchcUzmIMxxnq16fg%3D
          es	https://sdmntprnortheu.oaiusercontent.com/files/00000000-42e4-71f4-9582-6d91c6dfb10a/raw?se=2026-07-08T07:05:46Z&sp=r&sv=2026-02-06&sr=b&scid=62e3bce6-aeb4-5823-80fb-662d9b77562b&skoid=5bfb38a5-43fb-4c63-80a1-6ae1e97e2e16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-08T02:22:06Z&ske=2026-07-10T02:22:06Z&sks=b&skv=2026-02-06&sig=fh8VUc%2B95feCmUM/h2Jbe1Esh30NoQU4Q1Y9vr1lyp8%3D
          pt	https://sdmntprnortheu.oaiusercontent.com/files/00000000-3eb4-71f4-adfb-a1a27c5c2a6c/raw?se=2026-07-08T07:05:56Z&sp=r&sv=2026-02-06&sr=b&scid=efb784cb-bdb2-5f67-968f-3807c3def3de&skoid=5bfb38a5-43fb-4c63-80a1-6ae1e97e2e16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-08T06:15:16Z&ske=2026-07-10T06:15:16Z&sks=b&skv=2026-02-06&sig=rzdm4h9KhhEvqrKrk9xNjqy391cQL%2BnC5ckwfuN9MQo%3D
          de	https://sdmntprnortheu.oaiusercontent.com/files/00000000-9c7c-71f4-a2a5-1e036633bdcf/raw?se=2026-07-08T07:06:07Z&sp=r&sv=2026-02-06&sr=b&scid=f2a53802-5bc1-5d56-b59f-4f5ea94c7e95&skoid=5bfb38a5-43fb-4c63-80a1-6ae1e97e2e16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-08T06:35:02Z&ske=2026-07-10T06:35:02Z&sks=b&skv=2026-02-06&sig=koVImdCNosilLkbpOSqrCYTnl17TpD1N17L0IdYCYtI%3D
          fr	https://sdmntprnortheu.oaiusercontent.com/files/00000000-e4a0-71f4-bddf-e47623195f81/raw?se=2026-07-08T07:06:16Z&sp=r&sv=2026-02-06&sr=b&scid=92c8b3d3-bc4b-5be2-8213-8b41609c24ff&skoid=5bfb38a5-43fb-4c63-80a1-6ae1e97e2e16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-08T05:44:18Z&ske=2026-07-10T05:44:18Z&sks=b&skv=2026-02-06&sig=KIIVhG9DpcahXbnP%2BTa5UoZsNbtQpRny1FBvrXG5GFQ%3D
          pl	https://sdmntprnortheu.oaiusercontent.com/files/00000000-c764-71f4-a5b0-5a1df4871cb9/raw?se=2026-07-08T07:06:26Z&sp=r&sv=2026-02-06&sr=b&scid=aa798e1e-55a0-5b57-bc82-3301a132f094&skoid=5bfb38a5-43fb-4c63-80a1-6ae1e97e2e16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-08T05:08:17Z&ske=2026-07-10T05:08:17Z&sks=b&skv=2026-02-06&sig=bnEgDhafNmAlFzpr0wRhRkAKuFc5Ql4KNt06SljQInI%3D
          uk	https://sdmntprnortheu.oaiusercontent.com/files/00000000-bff4-71f4-9d9a-5380c6721ecb/raw?se=2026-07-08T07:06:38Z&sp=r&sv=2026-02-06&sr=b&scid=ce685fff-feb8-5c11-adea-f29ee3012ee9&skoid=5bfb38a5-43fb-4c63-80a1-6ae1e97e2e16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-08T03:39:53Z&ske=2026-07-10T03:39:53Z&sks=b&skv=2026-02-06&sig=DCasLAuKX8OP/RSYDGu6f5NCwMT%2Bxb1U6su57tK3k1A%3D
          EOF
          while IFS=$'\t' read -r lang url; do
            curl --fail --location --retry 2 "$url" -o "/tmp/stage04-artifacts/$lang.zip"
            mkdir -p "/tmp/stage04-artifacts/$lang"
            unzip -q "/tmp/stage04-artifacts/$lang.zip" -d "/tmp/stage04-artifacts/$lang"
            archive=$(find "/tmp/stage04-artifacts/$lang" -type f -name "stage04-$lang.tar.gz" | head -1)
            checksum=$(find "/tmp/stage04-artifacts/$lang" -type f -name "stage04-$lang.sha256" | head -1)
            test -n "$archive" -a -n "$checksum"
            (cd "$(dirname "$archive")" && sha256sum -c "$(basename "$checksum")")
            mkdir -p "/tmp/stage04-artifacts/$lang/extracted"
            tar -xzf "$archive" -C "/tmp/stage04-artifacts/$lang/extracted"
            test -d "/tmp/stage04-artifacts/$lang/extracted/site/$lang/books/radiance"
            mkdir -p "$lang/books"
            rm -rf "$lang/books/radiance"
            cp -a "/tmp/stage04-artifacts/$lang/extracted/site/$lang/books/radiance" "$lang/books/radiance"
          done < /tmp/stage04-artifacts/urls.tsv

      - name: Validate exact Stage 04 corpus
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --disable-pip-version-check beautifulsoup4
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          import json, subprocess
          langs=['en','pl','be','uk','de','fr','es','pt']
          titles={'en':('Radiance','Sampo','Song'),'pl':('Blask','Sampo','Pieśń'),'be':('Ззянне','САМПО','Песня'),'uk':('Сяйво','САМПО','Пісня'),'de':('Glanz','Sampo','Lied'),'fr':('Éclat','Sampo','Chant'),'es':('Resplandor','Sampo','Canto'),'pt':('Esplendor','Sampo','Canto')}
          routes=[('radiance',0),('radiance/sampo',569),('radiance/song',351)]
          total=0
          for lang in langs:
            for route,n in routes:
              path=Path(f'{lang}/books/{route}/index.html'); text=path.read_text(encoding='utf-8'); soup=BeautifulSoup(text,'html.parser')
              page='radiance' if route=='radiance' else route.rsplit('/',1)[1]
              title={'radiance':titles[lang][0],'sampo':titles[lang][1],'song':titles[lang][2]}[page]
              assert soup.html.get('lang')==lang and soup.h1 and soup.h1.get_text(' ',strip=True)==title, path
              assert soup.title and title in soup.title.get_text(' ',strip=True), path
              assert soup.find('link',rel='canonical').get('href')==f'https://www.ashraellen.com/{lang}/books/{route}/', path
              assert not any(x in text for x in ('window.__BASE__','innerHTML','textContent','fetch(')), path
              if n:
                ps=soup.find('details').find_all('p'); assert len(ps)==n,(path,len(ps),n)
                assert [p.get('data-p') for p in ps]==[str(i) for i in range(1,n+1)],path; total+=n
              scripts=soup.find_all('script',attrs={'type':'application/ld+json'}); assert len(scripts)==1,path
              types={x.get('@type') for x in json.loads(scripts[0].string or '{}').get('@graph',[])}
              req={'Person','WebSite','CollectionPage','BreadcrumbList','ImageObject','BookSeries' if page=='radiance' else 'Book'}
              assert req.issubset(types),(path,types)
              visible=soup.body.get_text(' ',strip=True); assert titles[lang][1] in visible,path
              if lang in ('be','uk'): assert 'Sampo' not in visible,path
          assert total==7360,total
          sources={'ru/books/radiance/index.html':'8d871ad4f8e5f19bba9f0be3bac20a86dd5184e1','ru/books/radiance/sampo/index.html':'009ca28cfb6d45ee766035c3f0bb1bc418d8b1dc','ru/books/radiance/song/index.html':'63ec0d3aedc8b716ecbd284bffe9b6cc6ebbc8fc'}
          for path,sha in sources.items(): assert subprocess.check_output(['git','hash-object',path],text=True).strip()==sha,path
          changed=set(subprocess.check_output(['git','diff','--name-only','origin/main...HEAD'],text=True).splitlines())
          assert changed=={'.github/workflows/stage04-radiance-transfer.yml'},changed
          print(json.dumps({'status':'PASS','pages':24,'protected_paragraphs':total},ensure_ascii=False))
          PY

      - name: Commit exact Stage 04 scope to main
        shell: bash
        run: |
          set -euxo pipefail
          rm -f .github/workflows/stage04-radiance-transfer.yml
          git add -A
          python - <<'PY'
          import subprocess
          langs=['en','pl','be','uk','de','fr','es','pt']
          expected={f'{lang}/books/{route}/index.html' for lang in langs for route in ['radiance','radiance/sampo','radiance/song']}
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert changed==expected,(sorted(changed-expected),sorted(expected-changed))
          print('scope PASS: 24 authorized Stage 04 pages')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Stage 04: synchronize Radiance family"
          git push origin HEAD:main
