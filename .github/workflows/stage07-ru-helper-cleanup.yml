name: Stage 07 Russian helper cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage07-ru-helper-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply isolated RU helper cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          paths = [
              Path('ru/books/seccus/index.html'),
              Path('ru/books/monolith/beton/index.html'),
              Path('ru/books/monolith/sludge/index.html'),
              Path('ru/books/error-404-god-not-found/index.html'),
              Path('ru/books/error-404-god-not-found/why-me/index.html'),
              Path('ru/books/you-are-already-online/index.html'),
              Path('ru/books/the-book-of-whinesis/index.html'),
          ]

          base_inline = "<script>(function(){const isGitHub=location.hostname.endsWith('github.io');const repo=location.pathname.split('/').filter(Boolean)[0];window.__BASE__=(isGitHub&&repo)?`/${repo}/`:`/`;})();</script>"
          base_block_re = re.compile(r"\n?\s*<script>\s*\(function\(\)\{\s*const isGitHub\s*=\s*location\.hostname\.endsWith\('github\.io'\);\s*const repo\s*=\s*location\.pathname\.split\('/'\)\.filter\(Boolean\)\[0\];\s*window\.__BASE__\s*=\s*\(isGitHub\s*&&\s*repo\)\s*\?\s*`/\$\{repo\}/`\s*:\s*`/`;\s*\}\)\(\);\s*</script>", re.S)

          full_helper_patterns = [
              # SECCUS helper-only script
              re.compile(r"\n?<script>\(function\(\)\{const base=window\.__BASE__\|\|'/';document\.getElementById\('toEntry'\)\.href=base\+'ru/';document\.getElementById\('toPublic'\)\.href=base\+'ru/public/';document\.getElementById\('toBooks'\)\.href=base\+'ru/books/';document\.getElementById\('toResearch'\)\.href=base\+'ru/research/';document\.getElementById\('backToBooks'\)\.href=base\+'ru/books/';document\.getElementById\('bottomResearch'\)\.href=base\+'ru/research/';document\.getElementById\('sealImg'\)\.src=base\+'assets/symbol\.png';\}\)\(\);</script>"),
              # BETON/SLUDGE helper-only script
              re.compile(r"\n?<script>\(function\(\)\{const base=window\.__BASE__\|\|'/';document\.getElementById\('toEntry'\)\.href=base\+'ru/';document\.getElementById\('toPublic'\)\.href=base\+'ru/public/';document\.getElementById\('toBooks'\)\.href=base\+'ru/books/';document\.getElementById\('toResearch'\)\.href=base\+'ru/research/';document\.getElementById\('backSeries'\)\.href=base\+'ru/books/monolith/';document\.getElementById\('sealImg'\)\.src=base\+'assets/symbol\.png';\}\)\(\);</script>"),
              # ERROR 404 series helper-only script
              re.compile(r"\n?\s*<script>\(function\(\)\{const base=window\.__BASE__\|\|'/';const whyMeHref=base\+'ru/books/error-404-god-not-found/why-me/';document\.getElementById\('toEntry'\)\.href=base\+'ru/';document\.getElementById\('toPublic'\)\.href=base\+'ru/public/';document\.getElementById\('toBooks'\)\.href=base\+'ru/books/';document\.getElementById\('toResearch'\)\.href=base\+'ru/research/';document\.getElementById\('goWhyMe'\)\.href=whyMeHref;document\.getElementById\('goWhyMeCover'\)\.href=whyMeHref;document\.getElementById\('sealImg'\)\.src=base\+'assets/symbol\.png';\}\)\(\);</script>"),
          ]

          def strip_link_assignments_preserve_toggle(text: str, page: str) -> str:
              # Why Me: remove helper assignments, preserve excerpt toggle in same script.
              if page.endswith('why-me/index.html'):
                  text = text.replace("<a id=\"toSeriesBottom\" class=\"btn secondary\" href=\"#\">← К серии 404</a>", "<a id=\"toSeriesBottom\" class=\"btn secondary\" href=\"https://www.ashraellen.com/ru/books/error-404-god-not-found/\">← К серии 404</a>")
                  old = "<script>(function(){const base=window.__BASE__||'/';const seriesHref=base+'ru/books/error-404-god-not-found/';document.getElementById('toEntry').href=base+'ru/';document.getElementById('toPublic').href=base+'ru/public/';document.getElementById('toBooks').href=base+'ru/books/';document.getElementById('toResearch').href=base+'ru/research/';document.getElementById('toSeriesBottom').href=seriesHref;document.getElementById('sealImg').src=base+'assets/symbol.png';const btn=document.getElementById('toggleExcerpt');const excerpt=document.getElementById('excerpt');btn.addEventListener('click',function(){const collapsed=excerpt.classList.toggle('is-collapsed');btn.textContent=collapsed?'Читать дальше':'Свернуть отрывок';});})();</script>"
                  new = "<script>(function(){const btn=document.getElementById('toggleExcerpt');const excerpt=document.getElementById('excerpt');btn.addEventListener('click',function(){const collapsed=excerpt.classList.toggle('is-collapsed');btn.textContent=collapsed?'Читать дальше':'Свернуть отрывок';});})();</script>"
                  text = text.replace(old, new)
              # Online: remove helper assignments, preserve excerpt toggle.
              if page.endswith('you-are-already-online/index.html'):
                  text = text.replace('id="backToBooks" href="#"', 'id="backToBooks" href="https://www.ashraellen.com/ru/books/"')
                  old = "<script>(function(){const base=window.__BASE__||'/';document.getElementById('toEntry').href=base+'ru/';document.getElementById('toPublic').href=base+'ru/public/';document.getElementById('toBooks').href=base+'ru/books/';document.getElementById('toResearch').href=base+'ru/research/';document.getElementById('backToBooks').href=base+'ru/books/';document.getElementById('sealImg').src=base+'assets/symbol.png';const excerpt=document.getElementById('excerpt');const toggle=document.getElementById('toggleExcerpt');toggle.addEventListener('click',function(){const collapsed=excerpt.classList.toggle('is-collapsed');toggle.textContent=collapsed?'Читать дальше':'Свернуть';});})();</script>"
                  new = "<script>(function(){const excerpt=document.getElementById('excerpt');const toggle=document.getElementById('toggleExcerpt');toggle.addEventListener('click',function(){const collapsed=excerpt.classList.toggle('is-collapsed');toggle.textContent=collapsed?'Читать дальше':'Свернуть';});})();</script>"
                  text = text.replace(old, new)
              # Whinesis: remove helper assignments from formatted script, preserve excerpt toggle.
              if page.endswith('the-book-of-whinesis/index.html'):
                  text = text.replace('id="backToBooks" href="#"', 'id="backToBooks" href="https://www.ashraellen.com/ru/books/"')
                  pattern = re.compile(r"\n\s*<script>\s*\(function\(\)\{\s*const base\s*=\s*window\.__BASE__\s*\|\|\s*'/';\s*document\.getElementById\('toEntry'\)\.href\s*=\s*base \+ 'ru/';\s*document\.getElementById\('toPublic'\)\.href\s*=\s*base \+ 'ru/public/';\s*document\.getElementById\('toBooks'\)\.href\s*=\s*base \+ 'ru/books/';\s*document\.getElementById\('toResearch'\)\.href\s*=\s*base \+ 'ru/research/';\s*document\.getElementById\('backToBooks'\)\.href\s*=\s*base \+ 'ru/books/';\s*document\.getElementById\('sealImg'\)\.src\s*=\s*base \+ 'assets/symbol\.png';\s*const excerpt\s*=\s*document\.getElementById\('excerpt'\);\s*const toggle\s*=\s*document\.getElementById\('toggleExcerpt'\);\s*toggle\.addEventListener\('click', function\(\)\{\s*const collapsed\s*=\s*excerpt\.classList\.toggle\('is-collapsed'\);\s*toggle\.textContent\s*=\s*collapsed \? 'Читать дальше' : 'Свернуть';\s*\}\);\s*\}\)\(\);\s*</script>", re.S)
                  new = "\n  <script>\n  (function(){\n    const excerpt = document.getElementById('excerpt');\n    const toggle = document.getElementById('toggleExcerpt');\n    toggle.addEventListener('click', function(){\n      const collapsed = excerpt.classList.toggle('is-collapsed');\n      toggle.textContent = collapsed ? 'Читать дальше' : 'Свернуть';\n    });\n  })();\n  </script>"
                  text = pattern.sub(new, text)
              return text

          for path in paths:
              if not path.exists():
                  raise SystemExit(f'Missing expected RU source page: {path}')
              original = path.read_text(encoding='utf-8')
              text = original
              text = text.replace(base_inline, '')
              text = base_block_re.sub('', text)
              for pattern in full_helper_patterns:
                  text = pattern.sub('', text)

              # Static destinations for placeholders before helper scripts are removed.
              if str(path).endswith('error-404-god-not-found/index.html'):
                  text = text.replace('id="goWhyMeCover" class="series-cover" href="#"', 'id="goWhyMeCover" class="series-cover" href="https://www.ashraellen.com/ru/books/error-404-god-not-found/why-me/"')
                  text = text.replace('id="goWhyMe" class="btn" href="#"', 'id="goWhyMe" class="btn" href="https://www.ashraellen.com/ru/books/error-404-god-not-found/why-me/"')

              text = strip_link_assignments_preserve_toggle(text, str(path))

              # Guardrails.
              if 'window.__BASE__' in text:
                  raise SystemExit(f'window.__BASE__ remains in {path}')
              if "const base=window.__BASE__" in text or "const base = window.__BASE__" in text:
                  raise SystemExit(f'base helper remains in {path}')

              if text != original:
                  path.write_text(text, encoding='utf-8')

          PY
      - name: Validate isolated cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          paths = [
              'ru/books/seccus/index.html',
              'ru/books/monolith/beton/index.html',
              'ru/books/monolith/sludge/index.html',
              'ru/books/error-404-god-not-found/index.html',
              'ru/books/error-404-god-not-found/why-me/index.html',
              'ru/books/you-are-already-online/index.html',
              'ru/books/the-book-of-whinesis/index.html',
          ]
          required_common = [
              'href="https://www.ashraellen.com/ru/"',
              'href="https://www.ashraellen.com/ru/public/"',
              'href="https://www.ashraellen.com/ru/books/"',
              'href="https://www.ashraellen.com/ru/research/"',
              'src="https://www.ashraellen.com/assets/symbol.png"',
          ]
          for p in paths:
              text = Path(p).read_text(encoding='utf-8')
              bad = ['window.__BASE__', 'location.hostname.endsWith', "href=base+", "href = base", "src=base+", "src = base"]
              for b in bad:
                  if b in text:
                      raise SystemExit(f'Forbidden helper fragment {b!r} remains in {p}')
              for req in required_common:
                  if req not in text:
                      raise SystemExit(f'Required static fragment {req!r} missing in {p}')
              if p.endswith('error-404-god-not-found/index.html'):
                  if 'id="goWhyMe" class="btn" href="https://www.ashraellen.com/ru/books/error-404-god-not-found/why-me/"' not in text:
                      raise SystemExit('goWhyMe static URL missing')
                  if 'id="goWhyMeCover" class="series-cover" href="https://www.ashraellen.com/ru/books/error-404-god-not-found/why-me/"' not in text:
                      raise SystemExit('goWhyMeCover static URL missing')
              if p.endswith('why-me/index.html'):
                  if 'id="toSeriesBottom" class="btn secondary" href="https://www.ashraellen.com/ru/books/error-404-god-not-found/"' not in text:
                      raise SystemExit('toSeriesBottom static URL missing')
                  if "toggleExcerpt" not in text or "addEventListener('click'" not in text:
                      raise SystemExit('Why Me excerpt toggle missing')
              if p.endswith('you-are-already-online/index.html') or p.endswith('the-book-of-whinesis/index.html'):
                  if 'id="backToBooks" href="https://www.ashraellen.com/ru/books/"' not in text:
                      raise SystemExit(f'backToBooks static URL missing in {p}')
                  if "toggleExcerpt" not in text or "addEventListener('click'" not in text:
                      raise SystemExit(f'excerpt toggle missing in {p}')
              if p.endswith('beton/index.html') or p.endswith('sludge/index.html'):
                  if 'id="backSeries" class="btn secondary" href="https://www.ashraellen.com/ru/books/monolith/"' not in text:
                      raise SystemExit(f'backSeries static URL missing in {p}')
          print('Stage 07 RU helper cleanup validation passed.')
          PY
      - name: Remove temporary workflow
        run: rm -f .github/workflows/stage07-ru-helper-cleanup.yml
      - name: Commit Stage 07 cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ru/books/seccus/index.html ru/books/monolith/beton/index.html ru/books/monolith/sludge/index.html ru/books/error-404-god-not-found/index.html ru/books/error-404-god-not-found/why-me/index.html ru/books/you-are-already-online/index.html ru/books/the-book-of-whinesis/index.html .github/workflows/stage07-ru-helper-cleanup.yml
          git diff --cached --name-only
          if git diff --cached --quiet; then
            echo "No Stage 07 RU helper cleanup changes needed."
            exit 0
          fi
          git commit -m "Stage 07: clean Russian source link helpers"
          git push
