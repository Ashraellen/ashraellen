name: Stage 03 source extraction

on:
  push:
    paths:
      - '.github/workflows/stage03-source-extract.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract pinned Russian source structure
        shell: python
        run: |
          import html
          import json
          import pathlib
          import re

          root = pathlib.Path('.')
          out = root / '.stage03_tmp'
          out.mkdir(exist_ok=True)

          paths = {
              'monolith': root / 'ru/books/monolith/index.html',
              'beton': root / 'ru/books/monolith/beton/index.html',
              'sludge': root / 'ru/books/monolith/sludge/index.html',
          }

          def textify(value: str) -> str:
              value = re.sub(r'<br\s*/?>', '\n', value, flags=re.I)
              value = re.sub(r'<[^>]+>', '', value)
              return html.unescape(value).strip()

          payload = {}
          for key, path in paths.items():
              raw = path.read_text(encoding='utf-8')
              pretty = re.sub(r'>\s*<', '>\n<', raw)
              (out / f'{key}.pretty.html').write_text(pretty, encoding='utf-8')
              payload[key] = {'path': str(path), 'sections': []}
              for index, section in enumerate(re.findall(r'<section\b.*?</section>', raw, flags=re.I | re.S), start=1):
                  header = re.search(r'<h2[^>]*>(.*?)</h2>', section, flags=re.I | re.S)
                  paragraphs = [textify(p) for p in re.findall(r'<p(?:\s[^>]*)?>(.*?)</p>', section, flags=re.I | re.S)]
                  payload[key]['sections'].append({
                      'index': index,
                      'heading': textify(header.group(1)) if header else '',
                      'paragraphs': paragraphs,
                      'html': section,
                  })

          (out / 'russian-source-structure.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2), encoding='utf-8'
          )
      - name: Commit temporary extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .stage03_tmp
          git diff --cached --quiet && exit 0
          git commit -m "Stage 03: extract Russian source structure"
          git push
