name: Generate sitemap

on:
  push:
    branches:
      - main
    paths:
      - '**/*.html'
      - 'scripts/apply-canonical.js'
      - 'scripts/apply-jsonld.js'
      - 'scripts/generate-sitemap.js'
      - '.github/workflows/sitemap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply canonical links
        run: node scripts/apply-canonical.js

      - name: Apply JSON-LD structured data
        run: node scripts/apply-jsonld.js

      - name: Generate sitemap.xml
        run: node scripts/generate-sitemap.js

      - name: Commit canonical links, JSON-LD and sitemap.xml if changed
        run: |
          if git diff --quiet; then
            echo "Canonical links, JSON-LD and sitemap.xml are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-update canonical links, JSON-LD and sitemap"
          git push
