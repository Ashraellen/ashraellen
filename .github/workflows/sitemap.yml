name: Generate sitemap

on:
  push:
    branches:
      - main
    paths:
      - '**/*.html'
      - 'scripts/apply-canonical.js'
      - 'scripts/apply-static-links.js'
      - 'scripts/apply-jsonld.js'
      - 'scripts/apply-og.js'
      - 'scripts/generate-sitemap.js'
      - 'scripts/submit-indexnow.js'
      - 'b2cda9f3e8714a6db926f48c7251ea65.txt'
      - 'assets/og/**'
      - '.github/workflows/sitemap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply canonical links
        run: node scripts/apply-canonical.js

      - name: Apply static link hygiene
        run: node scripts/apply-static-links.js

      - name: Apply JSON-LD structured data
        run: node scripts/apply-jsonld.js

      - name: Apply Open Graph tags
        run: node scripts/apply-og.js

      - name: Generate sitemap.xml
        run: node scripts/generate-sitemap.js

      - name: Submit sitemap URLs to IndexNow
        run: node scripts/submit-indexnow.js

      - name: Commit canonical links, static links, JSON-LD, Open Graph and sitemap.xml if changed
        run: |
          if git diff --quiet; then
            echo "Canonical links, static links, JSON-LD, Open Graph and sitemap.xml are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-update canonical links, static links, JSON-LD, Open Graph and sitemap"
          git push
