name: Generate sitemap

on:
  push:
    branches:
      - main
    paths:
      - '**/*.html'
      - 'scripts/add-missing-keywords.js'
      - 'scripts/clean-public-identity-head.py'
      - 'scripts/repair-title-description-og.py'
      - 'scripts/repair-structured-social-gaps.py'
      - 'scripts/dedupe-page-metadata.py'
      - 'scripts/audit-page-metadata.js'
      - 'scripts/export-page-keyword-workbench.js'
      - 'scripts/generate-sitemap.js'
      - 'scripts/submit-indexnow.js'
      - 'b2cda9f3e8714a6db926f48c7251ea65.txt'
      - '.github/workflows/sitemap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Add missing static keywords
        run: node scripts/add-missing-keywords.js

      - name: Clean public identity in ordinary page metadata
        run: python3 scripts/clean-public-identity-head.py

      - name: Repair title description and OG metadata
        run: python3 scripts/repair-title-description-og.py

      - name: Repair structured data and social gaps
        run: python3 scripts/repair-structured-social-gaps.py

      - name: Dedupe page metadata
        run: python3 scripts/dedupe-page-metadata.py

      - name: Audit page metadata
        run: node scripts/audit-page-metadata.js

      - name: Export page keyword workbench
        run: node scripts/export-page-keyword-workbench.js

      - name: Generate sitemap.xml
        run: node scripts/generate-sitemap.js

      - name: Submit sitemap URLs to IndexNow
        run: node scripts/submit-indexnow.js

      - name: Commit repaired HTML, sitemap.xml and reports if changed
        run: |
          if git diff --quiet; then
            echo "HTML, sitemap.xml and reports are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '**/*.html' sitemap.xml reports/page-metadata-audit.md reports/page-keyword-workbench.md reports/page-keyword-workbench.json
          git commit -m "Auto-repair static page metadata and reports"
          git push
