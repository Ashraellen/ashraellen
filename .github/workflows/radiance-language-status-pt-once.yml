name: One-time Portuguese Radiance language status update
on:
  push:
    paths:
      - '.github/workflows/radiance-language-status-pt-once.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update Portuguese status text
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              'pt/books/radiance/sampo/index.html': [
                  ('<strong>RU</strong><span>A versão russa está concluída.</span>', '<strong>RU</strong><span>A versão de autor está concluída.</span>'),
                  ('<strong>EN</strong><span>Transcrição literária em inglês concluída.</span>', '<strong>EN</strong><span>A versão literária em inglês encontra-se na fase final de preparação.</span>'),
                  ('<strong>FI</strong><span>A versão finlandesa é possível como próxima etapa do parceiro.</span>', '<strong>FI</strong><span>A versão literária em finlandês está prevista como a próxima etapa profissional do projeto.</span>'),
                  ('<li>Transcrição literária em inglês concluída.</li>', '<li>A versão literária em inglês encontra-se na fase final de preparação.</li>'),
              ],
              'pt/books/radiance/song/index.html': [
                  ('<strong>RU</strong><span>A versão russa está concluída.</span>', '<strong>RU</strong><span>A versão de autor está concluída.</span>'),
                  ('<strong>EN</strong><span>A transcriação literária inglesa está prevista como próxima etapa.</span>', '<strong>EN</strong><span>A versão literária em inglês é a próxima etapa do trabalho.</span>'),
                  ('<strong>FI</strong><span>A versão finlandesa é possível como próxima etapa do parceiro.</span>', '<strong>FI</strong><span>A versão literária em finlandês está prevista no âmbito do desenvolvimento futuro do projeto.</span>'),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{filename}: expected exactly one occurrence of {old!r}, found {count}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
      - name: Commit update and remove one-time workflow
        run: |
          rm .github/workflows/radiance-language-status-pt-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pt/books/radiance/sampo/index.html pt/books/radiance/song/index.html .github/workflows/radiance-language-status-pt-once.yml
          git commit -m "Update Portuguese Radiance language status"
          git push