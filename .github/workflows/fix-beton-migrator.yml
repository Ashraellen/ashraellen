name: Fix BETON migrator assertion
on:
  push:
    branches: [agent/beton-page-type]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/beton-page-type
          fetch-depth: 0
      - shell: bash
        run: |
          sed -i 's/assert opens == 8/assert opens == 9/; s/assert closes == 8/assert closes == 9/' .github/workflows/migrate-beton-page-type.yml
          rm .github/workflows/fix-beton-migrator.yml
          git config user.name "Ashraellen"
          git config user.email "ashraellen@gmail.com"
          git add -A
          git commit -m "Fix BETON migration wrapper assertion"
          git push origin HEAD:agent/beton-page-type
