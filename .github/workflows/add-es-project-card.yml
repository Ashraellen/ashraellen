name: Add Spanish project card

on:
  push:
    paths:
      - '.github/workflows/add-es-project-card.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Insert static HTML card
        shell: python
        run: |
          from pathlib import Path

          path = Path('es/public/index.html')
          text = path.read_text(encoding='utf-8')
          old = "<section class='card'><h2>Publicaciones</h2><p>Textos que salieron del laboratorio y se volvieron mensaje: pensamientos de apoyo, fragmentos, reacciones y observaciones.</p><a id='goPosts' href='posts/'>Abrir →</a></section></div>"
          new = "<section class='card'><h2>Publicaciones</h2><p>Textos que salieron del laboratorio y se volvieron mensaje: pensamientos de apoyo, fragmentos, reacciones y observaciones.</p><a id='goPosts' href='posts/'>Abrir →</a></section><section class='card'><h2>Proyectos</h2><p>Proyectos de investigación, literarios y mediáticos de Ashraellen — campos de trabajo independientes reunidos en un mismo espacio.</p><a href='https://www.ashraellen.com/es/research/projects/'>Abrir →</a></section></div>"
          if old not in text:
              raise SystemExit('Target HTML fragment not found')
          updated = text.replace(old, new, 1)
          if updated.count('<h2>Proyectos</h2>') != 1:
              raise SystemExit('Unexpected project card count')
          path.write_text(updated, encoding='utf-8')
          Path('.github/workflows/add-es-project-card.yml').unlink()
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add es/public/index.html .github/workflows/add-es-project-card.yml
          git commit -m "Add Spanish projects card"
          git push
