name: Stage 06 Whinesis title policy revision

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage06-whinesis-title-policy.yml'

permissions:
  contents: write

jobs:
  revise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply canonical Whinesis title policy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          langs = ['en','pl','be','uk','de','fr','es','pt']
          whinesis_pages = [Path(f'{lang}/books/the-book-of-whinesis/index.html') for lang in langs]
          index_pages = [Path(f'{lang}/books/index.html') for lang in langs]

          exact_replacements = {
              'Книга Нытия': 'The Book of Whinesis',
              'Кніга Ныцця': 'The Book of Whinesis',
              'Книга Ниття': 'The Book of Whinesis',
              'Księga Narzekania': 'The Book of Whinesis',
              'Das Buch der Whinesis': 'The Book of Whinesis',
              'Le Livre de Whinesis': 'The Book of Whinesis',
              'El Libro de Whinesis': 'The Book of Whinesis',
              'O Livro de Whinesis': 'The Book of Whinesis',
              'Livro de Whinesis': 'The Book of Whinesis',
              'Ashraellen — The Book of Whinesis — English': 'Ashraellen — The Book of Whinesis',
              'Ashraellen — The Book of Whinesis — Polish': 'Ashraellen — The Book of Whinesis',
              'Ashraellen — The Book of Whinesis — German': 'Ashraellen — The Book of Whinesis',
              'Ashraellen — The Book of Whinesis — French': 'Ashraellen — The Book of Whinesis',
              'Ashraellen — The Book of Whinesis — Spanish': 'Ashraellen — The Book of Whinesis',
              'Ashraellen — The Book of Whinesis — Ukrainian': 'Ashraellen — The Book of Whinesis',
              'Ashraellen — The Book of Whinesis — PT': 'Ashraellen — The Book of Whinesis',
          }

          # Canonical title must stay English. Localized body/subtitle text is otherwise preserved.
          for path in whinesis_pages + index_pages:
              if not path.exists():
                  raise SystemExit(f'Missing expected Stage 06 file: {path}')
              original = path.read_text(encoding='utf-8')
              text = original
              for old, new in exact_replacements.items():
                  text = text.replace(old, new)

              # Normalize any remaining language suffix in title/meta title contexts only.
              text = re.sub(r'(Ashraellen — The Book of Whinesis) — (English|Polish|Belarusian|Ukrainian|German|French|Spanish|Portuguese|PT)', r'\1', text)

              if text != original:
                  path.write_text(text, encoding='utf-8')

          changed = [str(p) for p in whinesis_pages + index_pages if p.exists()]
          print('Processed Stage 06 files:')
          for p in changed:
              print(' -', p)
          PY
      - name: Remove temporary workflow
        run: rm -f .github/workflows/stage06-whinesis-title-policy.yml
      - name: Commit Stage 06 revision
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add en/books/the-book-of-whinesis/index.html pl/books/the-book-of-whinesis/index.html be/books/the-book-of-whinesis/index.html uk/books/the-book-of-whinesis/index.html de/books/the-book-of-whinesis/index.html fr/books/the-book-of-whinesis/index.html es/books/the-book-of-whinesis/index.html pt/books/the-book-of-whinesis/index.html en/books/index.html pl/books/index.html be/books/index.html uk/books/index.html de/books/index.html fr/books/index.html es/books/index.html pt/books/index.html .github/workflows/stage06-whinesis-title-policy.yml
          if git diff --cached --quiet; then
            echo "No Stage 06 Whinesis title-policy changes needed."
            exit 0
          fi
          git commit -m "Stage 06: apply Whinesis title policy"
          git push
