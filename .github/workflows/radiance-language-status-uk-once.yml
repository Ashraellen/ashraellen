name: One-time Ukrainian Radiance language status update
on:
  push:
    paths:
      - '.github/workflows/radiance-language-status-uk-once.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update Ukrainian status text
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path('uk/books/radiance/sampo/index.html'): [
                  ('Російська версія завершена.', 'Авторська версія завершена.'),
                  ('Англійська літературна транскреація завершена.', 'Англійська літературна версія перебуває на фінальному етапі підготовки.'),
                  ('Фінська версія можлива як наступний партнерський етап.', 'Фінська літературна версія планується як наступний професійний етап проєкту.'),
                  ('Завершена англійська літературна транскреація.', 'Англійська літературна версія перебуває на фінальному етапі підготовки.'),
              ],
              Path('uk/books/radiance/song/index.html'): [
                  ('Російська версія завершена.', 'Авторська версія завершена.'),
                  ('Англійська літературна транскреація планується як наступний етап.', 'Англійська літературна версія — наступний етап роботи.'),
                  ('Фінська версія можлива як наступний партнерський етап.', 'Фінська літературна версія планується в межах подальшого розвитку проєкту.'),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one occurrence of {old!r}, found {count}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
      - name: Commit content update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uk/books/radiance/sampo/index.html uk/books/radiance/song/index.html
          git commit -m "Update Ukrainian Radiance language status"
          git push
      - name: Remove one-time workflow
        run: |
          git pull --rebase
          git rm .github/workflows/radiance-language-status-uk-once.yml
          git commit -m "Remove one-time Ukrainian Radiance status workflow"
          git push
