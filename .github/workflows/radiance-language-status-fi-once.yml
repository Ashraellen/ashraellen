name: One-time Finnish Radiance language status update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Finnish status text
        run: |
          python - <<'PY'
          from pathlib import Path

          changes = {
              Path('fi/books/radiance/sampo/index.html'): [
                  (
                      '<section class="list"><div class="list-header"><h2>Julkaisutilanne</h2><p class="note">englanninkielinen versio ensisijaisena</p></div><div class="section-body copy"><p>Suomenkielinen sivu on teoksen transkreaatioversio. Kansi ja mahdolliset osto- tai lukulinkit pidetään englanninkielisen laitoksen mukaisina siihen asti, kunnes erillinen suomalainen laitos on olemassa.</p>',
                      '<section class="list"><div class="list-header"><h2>Kieli- ja julkaisutilanne</h2><p class="note">nykyinen tilanne</p></div><div class="sampo-status-grid"><div class="sampo-status"><strong>RU</strong><span>Tekijän versio on valmis.</span></div><div class="sampo-status"><strong>EN</strong><span>Englanninkielinen kirjallinen versio on valmistelun loppuvaiheessa.</span></div><div class="sampo-status"><strong>PL</strong><span>Puolankielinen versio on valmisteilla.</span></div><div class="sampo-status"><strong>FI</strong><span>Suomenkielinen kirjallinen versio on suunniteltu projektin seuraavaksi ammatilliseksi vaiheeksi.</span></div></div><div class="section-body copy"><p>Tämä suomenkielinen verkkosivu on teoksen esittelysivun transkreaatioversio; se ei tarkoita, että erillinen suomenkielinen kirjallinen laitos olisi valmis.</p>'
                  )
              ],
              Path('fi/books/radiance/song/index.html'): [
                  (
                      '<section class="list"><div class="list-header"><h2>Julkaisutilanne</h2><p class="note">englanninkielinen versio ensisijaisena</p></div><div class="section-body copy"><p>Suomenkielinen sivu on teoksen transkreaatioversio. Kansi ja mahdolliset kaupalliset linkit pidetään englanninkielisen laitoksen mukaisina siihen asti, kunnes suomalainen laitos valmistuu.</p>',
                      '<section class="list"><div class="list-header"><h2>Kieli- ja julkaisutilanne</h2><p class="note">nykyinen tilanne</p></div><div class="song-status-grid"><div class="song-status"><strong>RU</strong><span>Tekijän versio on valmis.</span></div><div class="song-status"><strong>EN</strong><span>Englanninkielinen kirjallinen versio on työn seuraava vaihe.</span></div><div class="song-status"><strong>PL</strong><span>Puolankielinen versio on valmisteilla.</span></div><div class="song-status"><strong>FI</strong><span>Suomenkielinen kirjallinen versio on suunniteltu osaksi projektin jatkokehitystä.</span></div></div><div class="section-body copy"><p>Tämä suomenkielinen verkkosivu on teoksen esittelysivun transkreaatioversio; se ei tarkoita, että erillinen suomenkielinen kirjallinen laitos olisi valmis.</p>'
                  )
              ],
          }

          for path, replacements in changes.items():
              text = path.read_text(encoding='utf-8')
              for old, new in replacements:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected one match, got {count}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit content update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fi/books/radiance/sampo/index.html fi/books/radiance/song/index.html
          git commit -m 'Update Finnish Radiance language status'
          git push
      - name: Remove one-time workflow
        run: |
          git pull --rebase
          git rm .github/workflows/radiance-language-status-fi-once.yml
          git commit -m 'Remove one-time Finnish Radiance status workflow'
          git push
