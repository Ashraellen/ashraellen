name: One-time samizdat CSS version normalization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-samizdat-css-version.yml'

permissions:
  contents: write

jobs:
  normalize-css-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize samizdat CSS version on all language pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          for lang in ('be','de','en','es','fr','pl','pt','ru','uk'):
              path = Path(lang) / 'books' / 'samizdat' / 'index.html'
              text = path.read_text(encoding='utf-8')
              text = re.sub(
                  r'samizdat-en\.css\?v=[0-9-]+',
                  'samizdat-en.css?v=20260729-1',
                  text,
                  count=1,
              )
              path.write_text(text, encoding='utf-8')
          PY
      - name: Remove one-time workflow and commit result
        run: |
          rm .github/workflows/one-time-samizdat-css-version.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add be/books/samizdat/index.html de/books/samizdat/index.html en/books/samizdat/index.html es/books/samizdat/index.html fr/books/samizdat/index.html pl/books/samizdat/index.html pt/books/samizdat/index.html ru/books/samizdat/index.html uk/books/samizdat/index.html .github/workflows/one-time-samizdat-css-version.yml
          git commit -m "Samizdat: normalize hero image CSS version across languages"
          git push
