name: One-shot Portuguese pt-PT language cleanup

on:
  push:
    paths:
      - '.github/workflows/one-shot-pt-monolito-ptpt-qa.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize Portuguese MONOLITH branch to pt-PT
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          files=sorted(Path('pt/books/monolith').rglob('index.html'))
          reps=[
            ('<html lang="pt">','<html lang="pt-PT">'),
            ('"inLanguage":"pt"','"inLanguage":"pt-PT"'),
            ('Seus três volumes','Os seus três volumes'),
            ('seus três volumes','os seus três volumes'),
            ('Diante de você','Diante de si'),
            ('diante de você','diante de si'),
            ('crônica','crónica'),('Crônica','Crónica'),
            ('registro','registo'),('Registro','Registo'),
            ('registros','registos'),('Registros','Registos'),
            ('registrado','registado'),('registrada','registada'),('registrados','registados'),('registradas','registadas'),
            ('registra ','regista '),('registram ','registam '),('registrar ','registar '),
            ('cotidiana','quotidiana'),('cotidiano','quotidiano'),('cotidianas','quotidianas'),('cotidianos','quotidianos'),
            ('percepção','perceção'),('Percepção','Perceção'),
            ('recepção','receção'),('Recepção','Receção'),
            ('fato','facto'),('Fato','Facto'),('fatos','factos'),('Fatos','Factos'),
            ('contato','contacto'),('Contato','Contacto'),('contatos','contactos'),('Contatos','Contactos'),
            ('suas reações','as suas reações'),('sua realidade','a sua realidade'),('sua existência','a sua existência'),
            ('se desintegrar','desintegrar-se'),('se descomprimem','descomprimem-se'),('se dissolve','dissolve-se'),
            ('começa a se ','começa a '),('começam a se ','começam a '),
            ('por conta própria','por si própria'),('por conta própria','por si próprio'),
            ('por tempo demais','durante demasiado tempo'),
            ('mal consegue revelar','dificilmente consegue revelar'),
            ('por meio de uma palestra','através de uma palestra'),
            ('Ele entra na linguagem','Entra na linguagem'),
            ('Ela não se lembra','Não se lembra'),('Não teme tudo o que é perigoso. Concorda','Não teme tudo o que é perigoso. Concorda'),
            ('a pessoa perde gradualmente a forma','a pessoa vai perdendo gradualmente a forma'),
            ('começa a consentir com o ambiente','começa a ceder ao ambiente'),
            ('o próprio ar da normalidade','o próprio ar da normalidade'),
          ]
          for p in files:
              s=p.read_text(encoding='utf-8')
              for old,new in reps:
                  s=s.replace(old,new)
              # Correct a few awkward artifacts caused by legacy Brazilian syntax.
              s=s.replace('a ordem torna-se prisão','a ordem torna-se uma prisão')
              s=s.replace('A forma começa a desintegrar-se. A pessoa torna-se gradualmente substância do ambiente.','A forma começa a desintegrar-se. A pessoa torna-se gradualmente parte da matéria do meio.')
              s=s.replace('o momento em que uma pessoa ainda acredita pensar por si própria, embora as suas reações internas já tenham sido calibradas.','o momento em que uma pessoa ainda acredita pensar por si própria, apesar de as suas reações internas já terem sido calibradas.')
              s=s.replace('Não se lembra de tudo o que aconteceu. Não teme tudo o que é perigoso. Concorda não porque foi convencida, mas porque o ambiente há muito a treinou','Não se lembra de tudo o que aconteceu. Não teme tudo o que é perigoso. Concorda não por ter sido convencida, mas porque o meio há muito a treinou')
              p.write_text(s,encoding='utf-8')

          # Final invariants.
          alltext='\n'.join(p.read_text(encoding='utf-8') for p in files)
          forbidden=['Diante de você','crônica','registro','cotidiana','controle','Capa russa de','edição russa no Google Play Books','— sinal de presença','— marca de presença']
          bad=[x for x in forbidden if x in alltext]
          if bad: raise SystemExit('pt-PT cleanup failed, forbidden remains: '+repr(bad))
          for p in files:
              s=p.read_text(encoding='utf-8')
              if '<html lang="pt-PT">' not in s: raise SystemExit('lang missing: '+str(p))
              if '— mark of presence' not in s: raise SystemExit('mark invariant missing: '+str(p))
          # English cover and English reading edition checks.
          checks={
            'series covers': all(x in Path('pt/books/monolith/index.html').read_text(encoding='utf-8') for x in ['beton-en.webp','sludge-en.webp','GAS_EN_COVER_final_v01.webp']),
            'BETÃO google twice': Path('pt/books/monolith/beton/index.html').read_text(encoding='utf-8').count('GGKEY:6W7BCZQ9YQZ')==2,
            'LAMA google twice': Path('pt/books/monolith/sludge/index.html').read_text(encoding='utf-8').count('ISBN:978-5-0054-9349-4')==2,
            'GÁS google twice': Path('pt/books/monolith/gas/index.html').read_text(encoding='utf-8').count('NWEAEgAAQBAJ')==2,
          }
          for k,v in checks.items(): print(('PASS' if v else 'FAIL'),k)
          failed=[k for k,v in checks.items() if not v]
          if failed: raise SystemExit('Validation failed: '+repr(failed))
          PY
          rm -f .github/workflows/one-shot-pt-monolito-ptpt-qa.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Normalize Portuguese MONOLITO pages to pt-PT'
          git push