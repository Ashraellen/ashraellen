name: Add SLUDGE author note

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-sludge-author-note.yml'

permissions:
  contents: write

jobs:
  patch-and-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add static author note and remove workflow
        shell: python
        run: |
          from pathlib import Path

          path = Path('ru/books/monolith/sludge/index.html')
          text = path.read_text(encoding='utf-8')
          anchor = '''<section id="about-sludge" class="list"><div class="list-header"><h2>О книге</h2><p class="note">вторая стадия МОНОЛИТА</p></div><ul class="items"><li class="item" style="grid-template-columns:1fr;"><div class="body sludge-copy"><p>ЖИЖА начинается после первой трещины. Стена теряет жёсткость, но свобода не наступает: давление становится средой, размягчает границы и делает участие привычнее сопротивления.</p><p>В центре книги — Адам, лишившийся работы, дома и прежних опор. Его личное падение оказывается частью процесса, в котором человеческое «я» превращают в ресурс и материал среды.</p><p>Это второй том МОНОЛИТА: вязкая зона между твёрдостью и разгерметизацией, через которую невозможно пройти чистым.</p></div></li></ul></section>'''
          note = '''

<section id="author-note" class="list"><div class="list-header"><h2>От автора</h2><p class="note">о происхождении книги</p></div><ul class="items"><li class="item" style="grid-template-columns:1fr;"><div class="body sludge-copy"><p>Мы не создавали «ЖИЖУ» по заранее написанной философской схеме и не подгоняли её под готовое учение.</p><p class="quote-line" style="margin:0 0 12px;">Схема была не перед книгой — она находилась внутри того Источника, из которого книга возникла.</p><p>Лишь позднее мы смогли распознать и сформулировать принципы, которые уже действовали в её мире: истина не принадлежит одному голосу, смысл может прозвучать даже устами чудовища, принятие Реальности не означает одобрения поступков, а читатель сохраняет право услышать собственное.</p><p>Иногда произведение появляется раньше, чем автор находит слова для объяснения того, откуда оно пришло.</p></div></li></ul></section>'''
          if 'id="author-note"' not in text:
              if anchor not in text:
                  raise SystemExit('Expected about-sludge anchor not found; no changes made.')
              text = text.replace(anchor, anchor + note, 1)
              path.write_text(text, encoding='utf-8')

          Path('.github/workflows/add-sludge-author-note.yml').unlink()
      - name: Commit site update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ru/books/monolith/sludge/index.html .github/workflows/add-sludge-author-note.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add author note to SLUDGE book page"
          git push origin HEAD:main
