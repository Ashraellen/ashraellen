name: Finalize Ukrainian GAS

on:
  push:
    paths:
      - '.github/workflows/one-shot-uk-gas-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build page and clean staging files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p uk/books/monolith/gas
          cat .tmp/uk-gas.gz.b64.part1 .tmp/uk-gas.gz.b64.part2 .tmp/uk-gas.gz.b64.part3 .tmp/uk-gas.gz.b64.part4 > /tmp/uk-gas.b64
          base64 -d /tmp/uk-gas.b64 | gzip -d > uk/books/monolith/gas/index.html
          test -s uk/books/monolith/gas/index.html
          grep -q 'МОНОЛІТ' uk/books/monolith/gas/index.html
          grep -q 'БЕТОН' uk/books/monolith/gas/index.html
          grep -q 'ЖИЖА' uk/books/monolith/gas/index.html
          grep -q 'EWEAEgAAQBAJ' uk/books/monolith/gas/index.html
          grep -q 'B0HDQDVJ7G' uk/books/monolith/gas/index.html
          grep -q 'GAS_RU_COVER_final_v01.webp' uk/books/monolith/gas/index.html
          rm -f .tmp/uk-gas.gz.b64.part1 .tmp/uk-gas.gz.b64.part2 .tmp/uk-gas.gz.b64.part3 .tmp/uk-gas.gz.b64.part4
          rm -f .github/workflows/one-shot-uk-gas-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add Ukrainian GAS page'
          git push
