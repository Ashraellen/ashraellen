name: One-shot German MONOLITH rollout

on:
  push:
    paths:
      - '.github/workflows/one-shot-de-monolith-rollout.yml'

permissions:
  contents: write

jobs:
  rollout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update German series, BETON and SCHLAMM
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          series=Path('de/books/monolith/index.html')
          beton=Path('de/books/monolith/beton/index.html')
          sludge=Path('de/books/monolith/sludge/index.html')

          for p in [series,beton,sludge]:
              s=p.read_text(encoding='utf-8')
              s=s.replace('<html lang="de">','<html lang="de-DE">')
              s=s.replace('"inLanguage":"de"','"inLanguage":"de-DE"')
              s=s.replace('SLUDGE','SCHLAMM')
              p.write_text(s,encoding='utf-8')

          # Series: English covers + active GAS card + third hasPart.
          s=series.read_text(encoding='utf-8')
          s=s.replace('../../../assets/covers/beton-ru.webp','../../../assets/covers/beton-en.webp')
          s=s.replace('../../../assets/covers/sludge-ru.webp','../../../assets/covers/sludge-en.webp')
          s=s.replace('Russisches Cover von BETON','Englisches Cover von BETON')
          s=s.replace('Russisches Cover von SCHLAMM','Englisches Cover von SCHLAMM')
          import re
          s=re.sub(r'<div class="cover placeholder">GAS</div><h3>Band III — GAS</h3><p>(.*?)</p><span class="btn secondary">In Vorbereitung</span>',
                   r'<div class="cover"><img src="../../../assets/covers/GAS_EN_COVER_final_v01.webp" alt="Englisches Cover von GAS" loading="lazy"></div><h3>Band III — GAS</h3><p>\1</p><a class="btn" href="https://www.ashraellen.com/de/books/monolith/gas/">Band öffnen</a>',s,count=1,flags=re.S)
          marker='{"@id":"https://www.ashraellen.com/de/books/monolith/sludge/#book"}]'
          if marker in s:
              s=s.replace(marker,'{"@id":"https://www.ashraellen.com/de/books/monolith/sludge/#book"},{"@id":"https://www.ashraellen.com/de/books/monolith/gas/#book"}]')
          # Small German style refinements.
          s=s.replace('der Umgebung zuzustimmen beginnt','sich der Umgebung anzupassen beginnt')
          s=s.replace('Ein Mensch wird allmählich zur Substanz der Umgebung.','Ein Mensch wird allmählich selbst zum Material seiner Umgebung.')
          s=s.replace('Kontrolle versucht, unsichtbar zu werden','Kontrolle versucht unsichtbar zu werden')
          series.write_text(s,encoding='utf-8')

          # BETON: English cover and English reading edition in both link groups.
          s=beton.read_text(encoding='utf-8')
          s=s.replace('../../../../assets/covers/beton-ru.webp','../../../../assets/covers/beton-en.webp')
          s=s.replace('https://www.ashraellen.com/assets/covers/beton-ru.webp','https://www.ashraellen.com/assets/covers/beton-en.webp')
          s=s.replace('Russisches Cover von BETON','Englisches Cover von BETON')
          s=s.replace('https://play.google.com/store/books/details?id=S__VEQAAQBAJ','https://play.google.com/store/books/details/Savva_Libegotski_BETON?id=GGKEY:6W7BCZQ9YQZ')
          s=s.replace('Russische Ausgabe bei Google Play Books lesen','Englische Ausgabe bei Google Play Books lesen')
          s=s.replace('Russische Ausgabe bei Google Play Books','Englische Ausgabe bei Google Play Books')
          beton.write_text(s,encoding='utf-8')

          # SCHLAMM: English cover and English reading edition in both link groups.
          s=sludge.read_text(encoding='utf-8')
          s=s.replace('../../../../assets/covers/sludge-ru.webp','../../../../assets/covers/sludge-en.webp')
          s=s.replace('https://www.ashraellen.com/assets/covers/sludge-ru.webp','https://www.ashraellen.com/assets/covers/sludge-en.webp')
          s=s.replace('Russisches Cover von SCHLAMM','Englisches Cover von SCHLAMM')
          s=s.replace('https://play.google.com/store/books/details/Ashraellen_%D0%96%D0%98%D0%96%D0%90?id=-bzWEQAAQBAJ','https://play.google.com/store/books/details/Savva_Libegotski/SLUDGE?id=ISBN:978-5-0054-9349-4')
          s=s.replace('Russische Ausgabe bei Google Play Books lesen','Englische Ausgabe bei Google Play Books lesen')
          s=s.replace('Russische Ausgabe bei Google Play Books','Englische Ausgabe bei Google Play Books')
          sludge.write_text(s,encoding='utf-8')

          # Checks.
          checks={
            'series canon': all(x in series.read_text(encoding='utf-8') for x in ['MONOLITH','BETON','SCHLAMM','GAS']),
            'series English covers': all(x in series.read_text(encoding='utf-8') for x in ['beton-en.webp','sludge-en.webp','GAS_EN_COVER_final_v01.webp']),
            'series GAS active': '/de/books/monolith/gas/' in series.read_text(encoding='utf-8'),
            'BETON Google twice': beton.read_text(encoding='utf-8').count('GGKEY:6W7BCZQ9YQZ')==2,
            'SCHLAMM Google twice': sludge.read_text(encoding='utf-8').count('ISBN:978-5-0054-9349-4')==2,
            'BETON English cover': 'beton-en.webp' in beton.read_text(encoding='utf-8'),
            'SCHLAMM English cover': 'sludge-en.webp' in sludge.read_text(encoding='utf-8'),
          }
          for p in [series,beton,sludge]:
              t=p.read_text(encoding='utf-8')
              checks[str(p)+' lang']= '<html lang="de-DE">' in t
              checks[str(p)+' mark']= '— mark of presence' in t
          for k,v in checks.items(): print(('PASS' if v else 'FAIL'),k)
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('Validation failed: '+repr(bad))
          PY
          rm -f .github/workflows/one-shot-de-monolith-rollout.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Roll out German MONOLITH canon and English editions'
          git push