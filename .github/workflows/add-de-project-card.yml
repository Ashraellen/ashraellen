name: Add German project card

on:
  push:
    paths:
      - '.github/workflows/add-de-project-card.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Insert static HTML card
        shell: python
        run: |
          from pathlib import Path

          path = Path('de/public/index.html')
          text = path.read_text(encoding='utf-8')
          old = "<section class='card'><h2>Veröffentlichungen</h2><p>Texte, die das Labor verlassen haben und zur Botschaft wurden: Stützgedanken, Fragmente, Reaktionen und Beobachtungen.</p><a id='goPosts' href='posts/'>Öffnen →</a></section></div>"
          new = "<section class='card'><h2>Veröffentlichungen</h2><p>Texte, die das Labor verlassen haben und zur Botschaft wurden: Stützgedanken, Fragmente, Reaktionen und Beobachtungen.</p><a id='goPosts' href='posts/'>Öffnen →</a></section><section class='card'><h2>Projekte</h2><p>Forschungs-, Literatur- und Medienprojekte von Ashraellen — eigenständige Arbeitsfelder, die in einem gemeinsamen Raum versammelt sind.</p><a href='https://www.ashraellen.com/de/research/projects/'>Öffnen →</a></section></div>"
          if old not in text:
              raise SystemExit('Target HTML fragment not found')
          updated = text.replace(old, new, 1)
          if updated.count('<h2>Projekte</h2>') != 1:
              raise SystemExit('Unexpected project card count')
          path.write_text(updated, encoding='utf-8')
          Path('.github/workflows/add-de-project-card.yml').unlink()
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add de/public/index.html .github/workflows/add-de-project-card.yml
          git commit -m "Add German projects card"
          git push
