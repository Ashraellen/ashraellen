name: Stage 03 final trigger

on:
  push:
    branches:
      - stage03-final-revision

permissions:
  contents: write

jobs:
  run-final-revision:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout revision branch with history
        uses: actions/checkout@v4
        with:
          ref: stage03-final-revision
          fetch-depth: 0

      - name: Execute validated revision and checks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/stage03-final-revision.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()
          blocks = []
          i = 0
          while i < len(lines):
              line = lines[i]
              if line.strip() == 'run: |':
                  indent = len(line) - len(line.lstrip())
                  i += 1
                  body = []
                  while i < len(lines):
                      current = lines[i]
                      current_indent = len(current) - len(current.lstrip()) if current.strip() else indent + 2
                      if current.strip() and current_indent <= indent:
                          break
                      body.append(current[indent + 2:] if len(current) >= indent + 2 else '')
                      i += 1
                  blocks.append('\n'.join(body))
                  continue
              i += 1

          if len(blocks) < 3:
              raise SystemExit(f'Expected at least three run blocks, found {len(blocks)}')

          for number, block in enumerate(blocks[:3], 1):
              print(f'Executing validated block {number}/3')
              subprocess.run(['bash', '-euo', 'pipefail', '-c', block], check=True)
          PY

      - name: Commit clean validated result
        shell: bash
        run: |
          rm -f .github/workflows/stage03-final-revision.yml
          rm -f .github/workflows/stage03-final-trigger.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Stage 03: finalize SLUDGE source parity and clean scope"
          git push origin HEAD:stage03-final-revision
