name: One-shot Polish MONOLITH title canon

on:
  push:
    paths:
      - '.github/workflows/one-shot-pl-monolith-title-canon.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Canonize Polish displayed titles
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('pl/books/monolith/index.html')
          s = p.read_text(encoding='utf-8')
          if 'SLUDGE' not in s:
              raise SystemExit('Expected SLUDGE occurrences not found')
          s = s.replace('SLUDGE', 'SZLAM')
          p.write_text(s, encoding='utf-8')
          PY
          git rm .github/workflows/one-shot-pl-monolith-title-canon.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pl/books/monolith/index.html
          git commit -m "Use Polish SZLAM title on MONOLITH page"
          git push
