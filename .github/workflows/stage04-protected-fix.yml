name: Stage 04 protected-content patch

on:
  push:
    paths:
      - '.github/workflows/stage04-protected-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Patch Stage 04 English protected chapters
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_checked(path, pairs):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              original = text
              applied = []
              for old, new in pairs:
                  if old in text:
                      text = text.replace(old, new)
                      applied.append(old[:80])
              # remove invisible automated-processing residues without changing visible prose
              text = text.replace('\u200b', '').replace('\u200c', '').replace('\u200d', '').replace('\ufeff', '')
              if text != original:
                  p.write_text(text, encoding='utf-8')
              print(path, 'changed' if text != original else 'unchanged', 'replacements', len(applied))

          replace_checked('en/books/radiance/sampo/index.html', [
              ('Beams. Not bread.', 'Kindling. Not bread.'),
              ('Luchins. Dry, not dry.', 'Splinters. Dry or not dry.'),
              ('Then he slowly walked along the dry tree.', 'Then he slowly walked along the dry wood.'),
              ('Because he was good.', 'Because it was good.'),
              ('Because the warm bread that you took “for later” still remains bread. He doesn\'t turn into an accuser. Doesn\'t become a monster. Doesn\'t require confession. He just keeps feeding.', 'Because the warm bread that you took “for later” still remains bread. It does not turn into an accuser. It does not become a monster. It does not require confession. It simply keeps feeding.'),
              ('— As if he was waiting.', '— As if it was waiting.'),
              ('I didn’t blame the bread.', 'The bread did not blame.'),
              ('Didn\'t scare me.', 'It did not frighten.'),
              ('Didn\'t prove it.', 'It did not prove anything.'),
              ('He waited.', 'It waited.'),
              ('Something else is more important to her: the readiness to enter a world where the fairy tale has not yet become fiction, but the thing still remembers that it was a sign.', 'Something else is more important to them: the readiness to enter a world where the fairy tale has not yet become fiction, but the thing still remembers that it was a sign.'),
              ('presentations artistic research through fiction.', 'presentations of artistic research through fiction.'),
              ('artistic and research cycle', 'artistic-research cycle'),
              ('Art Research Frame', 'Artistic-research frame'),
          ])

          replace_checked('en/books/radiance/song/index.html', [
              ('form of customization', 'form of attunement'),
              ('He was just doing the job.', 'It was just doing its job.'),
              ('Isla sat by the window', 'Ayla sat by the window'),
              ('And almost immediately I heard too much.', 'And almost immediately she heard too much.'),
              ('On the twelfth there is a drum', 'At the twelfth second there is a drum'),
              ('And for some reason this is what saved me.', 'And for some reason this is what saved her.'),
              ('Fingers laid on them with familiar precision.', 'Her fingers settled on them with familiar precision.'),
              ('Old movement. Your weight. Your balance.', 'An old movement. Her weight. Her balance.'),
              ('The click was merciless. Unlike people, he was not interested', 'The click was merciless. Unlike people, it was not interested'),
              ('Ayla clicked accept.', 'Ayla accepted the call.'),
              ('- Physically, yes. Artistically, there is an investigation underway.', '— Physically, yes. Artistically, an investigation is underway.'),
              ('Martha passed out', 'Martha hung up'),
              ('Marta passed out', 'Marta hung up'),
              ('This was the crack.', 'This was the opening.'),
              ('Neighbors\' votes are a random batch.', 'Neighbors\' voices are a random batch.'),
              ('I didn\'t steal.', 'She did not steal.'),
              ('There was no fire. He participated.', 'The fire was not a supply. It participated.'),
              ('This time I didn’t turn on the click right away.', 'This time she did not turn on the click right away.'),
              ('Fingers on the tree of hammers.', 'Fingers on the wooden handles of the hammers.'),
              ('I let him go.', 'She let it go.'),
              ('But irritation did not have time to close my ears.', 'But irritation did not have time to close her ears.'),
              ('Dry hit on average.', 'A dry hit in the middle register.'),
              ('In life, he kept the phrase on the ground.', 'In life, it kept the phrase on the ground.'),
              ('Then I thought about it and renamed it:', 'Then she thought about it and renamed it:'),
              ('Let him lie.', 'Let it lie.'),
              ('Let him make noise.', 'Let it make noise.'),
              ('It’s very convenient to say this when you’re not the one to send a sketch tomorrow', 'It is very convenient to say this when you are not the one who has to send a sketch tomorrow'),
              ('He\'s already noisy.', 'It is already making noise.'),
              ('Instead, I went to the kitchen and made myself scrambled eggs.', 'Instead, she went to the kitchen and made herself scrambled eggs.'),
              ('Then I thought that if Song always sounds', 'Then she thought that if Song always sounds'),
              ('Isla wrote:', 'Ayla wrote:'),
              ('Is that correct?', 'Was that true?'),
              ('A man returns from a place', 'A person returns from a place'),
              ('He ​​was in pipes', 'It was in pipes'),
              ('He was in pipes', 'It was in pipes'),
              ('Previous right to consider sound as your material.', 'The former right to consider sound her material.'),
              ('beauty injury', 'wound from beauty'),
              ('the pauses between words are as if you are checking if there is a secret hatch', 'the pauses between words sound as if you are checking whether there is a hidden hatch'),
              ('What is more important to her is the willingness', 'What is more important to them is the willingness'),
              ('presentations artistic research through fiction.', 'presentations of artistic research through fiction.'),
          ])

          # focused same-defect spot-check across other Stage 04 protected target files: fix only exact confirmed processing residue in English-derived artifacts if present
          for lang in ['pl','be','uk','de','fr','es','pt']:
              for book in ['sampo','song']:
                  path = Path(f'{lang}/books/radiance/{book}/index.html')
                  if path.exists():
                      text = path.read_text(encoding='utf-8')
                      cleaned = text.replace('\u200b', '').replace('\u200c', '').replace('\u200d', '').replace('\ufeff', '')
                      if cleaned != text:
                          path.write_text(cleaned, encoding='utf-8')
                          print(path, 'removed invisible processing residue')

          for path, expected in [('en/books/radiance/sampo/index.html',569), ('en/books/radiance/song/index.html',351)]:
              text = Path(path).read_text(encoding='utf-8')
              count = len(re.findall(r'data-p="\\d+"', text))
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} data-p paragraphs, found {count}')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status --short
          if ! git diff --quiet; then
            git add en/books/radiance/sampo/index.html en/books/radiance/song/index.html pl/books/radiance/sampo/index.html pl/books/radiance/song/index.html be/books/radiance/sampo/index.html be/books/radiance/song/index.html uk/books/radiance/sampo/index.html uk/books/radiance/song/index.html de/books/radiance/sampo/index.html de/books/radiance/song/index.html fr/books/radiance/sampo/index.html fr/books/radiance/song/index.html es/books/radiance/sampo/index.html es/books/radiance/song/index.html pt/books/radiance/sampo/index.html pt/books/radiance/song/index.html
            git commit -m "Stage 04: revise English protected chapters"
            git push
          else
            echo "No protected-content changes required"
          fi