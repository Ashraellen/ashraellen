name: Stage 04 protected patch

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Final protected cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_checked(path, pairs):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              original = text
              hits = []
              for old, new in pairs:
                  if old in text:
                      text = text.replace(old, new)
                      hits.append(old)
              text = text.replace('\u200b', '').replace('\u200c', '').replace('\u200d', '').replace('\ufeff', '')
              if text != original:
                  p.write_text(text, encoding='utf-8')
              print(f'{path}: {"changed" if text != original else "unchanged"}; replacements={len(hits)}')
              for h in hits:
                  print('  -', h[:120])

          replace_checked('en/books/radiance/sampo/index.html', [
              ('There was no sign that the ground beneath him had been a body yesterday.', 'There was no sign that the ground beneath it had been a body yesterday.'),
              ('Sofia saw him immediately.', 'Sofia saw it immediately.'),
          ])

          replace_checked('en/books/radiance/song/index.html', [
              ('So correct that I wanted to ask:', 'So correct that she wanted to ask:'),
              ('a professional voice rose in my head:', 'a professional voice rose in her head:'),
              ('<p data-p="187">She was not beautiful.', '<p data-p="187">It was not beautiful.'),
              ('She did not steal. I didn\'t devalue it.', 'She did not steal. She did not devalue it.'),
              ('<p data-p="240">I thought.</p>', '<p data-p="240">She thought.</p>'),
              ('This time she did not turn on the click right away. I sat. She listened to the room.', 'This time she did not turn on the click right away. She sat. She listened to the room.'),
              ('a person needs to notice: he is not the only one making the sound.', 'a person needs to notice: she is not the only one making the sound.'),
              ('Ayla thought almost irritably: ideal, of course, public transport now also wants to be included in the arrangement.', 'Ayla thought almost irritably: perfect, of course, public transport now also wants to be included in the arrangement.'),
              ('“Let him make noise” is also my answer.', '“Let it make noise” is also an answer.'),
              ('Shouldn\'t have become one.', 'He should not have become one.'),
              ('<p data-p="305">Walked up to the shelf with the kantele.</p>', '<p data-p="305">She walked up to the shelf with the kantele.</p>'),
              ('<p data-p="306">Didn\'t open the case.</p>', '<p data-p="306">She did not open the case.</p>'),
              ('<p data-p="307">Just stood there.</p>', '<p data-p="307">She just stood there.</p>'),
              ('and at home he is greeted by yogurt that needs to be thrown away.', 'and at home she is greeted by yogurt that needs to be thrown away.'),
              ('<div class="song-status"><strong>EN</strong><span>English literary transcreation is planned as the next stage.</span></div>', '<div class="song-status"><strong>EN</strong><span>English literary transcreation completed.</span></div>'),
              ('Partnership for English, Polish and Finnish versions.', 'Partnership for Polish and Finnish versions.'),
              ('Art Research Frame', 'Artistic-research frame'),
              ('can language become a form of attunement to the order of reality.', 'can language become a form of attunement to the order of reality.'),
          ])

          expected = {'en/books/radiance/sampo/index.html': 569, 'en/books/radiance/song/index.html': 351}
          for path, exp in expected.items():
              text = Path(path).read_text(encoding='utf-8')
              nums = [int(n) for n in re.findall(r'data-p="(\d+)"', text)]
              if len(nums) != exp or nums != list(range(1, exp+1)):
                  raise SystemExit(f'{path}: bad data-p sequence/count: {len(nums)} expected {exp}')
              print(path, 'data-p OK', exp)
          PY
      - name: Commit final protected cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status --short
          if ! git diff --quiet; then
            git add en/books/radiance/sampo/index.html en/books/radiance/song/index.html
            git commit -m "Stage 04: final English protected cleanup"
            git push
          else
            echo "No final protected cleanup changes"
          fi
