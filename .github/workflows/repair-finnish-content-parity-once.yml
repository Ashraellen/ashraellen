name: One-time Finnish content parity repair
on:
  push:
    paths:
      - '.github/workflows/repair-finnish-content-parity-once.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore Finnish Professional parity and full LIETE fragment
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('fi/professional/index.html')
          s = p.read_text(encoding='utf-8')

          pairs = [
            ('<a href="#core">Ydin</a><a href="#about">Tekijä</a><a href="#method">Menetelmä</a>',
             '<a href="#core">Ydin</a><a href="#about">Tekijä</a><a href="#trajectory">Kehityskaari</a><a href="#method">Menetelmä</a>'),
            ('<p>Taiteellinen muoto ei ole tässä koriste. Siitä tulee tietämisen tapa. Romaani toimii pitkäkestoisena tutkimusvälineenä; esseet ja muotoilut kirjaavat havaintoja kirkkauden hetkellä; video ja julkinen vaste koettelevat ajatusta elävässä reaktiossa; visuaaliset kuvat lähestyvät havainnon kerroksia, joissa merkitys ei ole vielä muuttunut käsitteeksi.</p>',
             '<p>Taiteellinen muoto ei ole tässä koriste. Siitä tulee tietämisen tapa. Romaani toimii pitkäkestoisena tutkimusvälineenä; esseet ja muotoilut kirjaavat havaintoja kirkkauden hetkellä; video ja julkinen vaste tarjoavat kenttäaineistoa; visuaaliset kuvat lähestyvät havainnon kerroksia, joissa merkitys ei ole vielä muuttunut käsitteeksi.</p>'),
            ('<p>Havainnon yleispätevyyttä ei testata vain tilastoilla vaan myös tunnistamisella: hetkellä, jolloin lukija löytää kuvauksen omasta kokemuksestaan siellä, missä ei odottanut sitä kohtaavansa.</p>',
             '<p>Lukijan vaste voi viitata toistuvaan mekanismiin, mutta se ei itsessään todista mekanismin yleispätevyyttä. Se muodostaa osan aineistosta, jonka kanssa tutkimus jatkaa työskentelyä.</p>')
          ]
          for old,new in pairs:
              assert s.count(old) == 1, old[:80]
              s = s.replace(old,new,1)

          anchor = '<p>Ashraellen ei ala sisällöntuotannosta. Kirjat, esseet, romaanit, videot, ääniteokset, satiiri, symboliset tulkinnat, julkiset muotoilut ja monikielinen arkisto ovat eri tapoja tallentaa yhtä pitkäkestoista tutkimusta.</p>'
          extra = '\n            <p>Tutkimusta tehdään ennen kaikkea tekijän oman ymmärryksen vuoksi. Sen tehtävänä ei ole vahvistaa ennalta valittua teoriaa tai vakuuttaa yleisöä, vaan kirjata rehellisesti se ymmärrys, johon tässä hetkessä on päästy, ja jatkaa siitä eteenpäin. Täältä löytynyt vastaus ei sulje kysymystä: se muuttaa kohtaa, josta seuraava kysymys syntyy.</p>\n            <p>Siksi kirjoja, tekstejä ja muita teoksia ei käsitellä järjestelmän lopullisina muotoiluina. Kukin niistä säilyttää tietyn tutkimuksen tilan — silloinkin, kun tekijän ymmärrys myöhemmin muuttuu.</p>'
          assert s.count(anchor) == 1
          s = s.replace(anchor, anchor + extra, 1)

          marker = '          <section id="method" class="dossier-section">'
          trajectory = '          <section id="trajectory" class="dossier-section">\n            <h2>Miten työskentelyn kenttä laajeni</h2>\n            <p>Kirjallinen työ vei tutkimusta vähitellen yksittäisen teoksen rajojen ulkopuolelle. Laajojen tekstien parissa työskentely osoitti, että sama kysymys voi vaatia eri muotoja — romaanin, lyhyen tekstin, kuvan, äänen tai julkisen havainnon.</p>\n            <p>Monikielinen julkaiseminen nosti esiin käytännöllisen kysymyksen: mitä on säilytettävä, kun teksti kulkee toisen kielen ja tekoälyn kautta, jotta tekijä ei katoa sanojen mukana? VOICEPRINT-työkehys kasvoi sisäisestä tarpeesta ratkaista tämä ongelma — ennen kaikkea tekijän oman monikielisen ja kirjallisen käytännön työvälineeksi.</p>\n            <p>Pitkäaikainen työ tekoälyn kanssa toi esiin toisen sisäisen tarpeen: päätösten, niiden alkuperän, kontekstin, epävarmuuden ja projektin nykytilan säilyttämisen erillisten keskustelujen ja työskentelyjaksojen yli. Tästä tarpeesta kasvoi MY MEMORY; sen nykyistä sisäistä MMS 2.0 -kehystä käytetään tekijän oman pitkäkestoisen työn jatkuvuuden ylläpitämiseen.</p>\n            <p>Kumpikaan suunta ei alkanut ennalta suunniteltuna tuotteena eikä yrityksenä väittää teknistä uutuutta. Molemmat syntyivät pääasiallisen tekijäkäytännön konkreettisista tehtävistä ja toimivat edelleen ensisijaisesti tämän käytännön tukevina työvälineinä.</p>\n          </section>\n\n'
          assert 'id="trajectory"' not in s
          assert s.count(marker) == 1
          s = s.replace(marker, trajectory + marker, 1)
          p.write_text(s, encoding='utf-8')

          fp = Path('fi/books/monolith/sludge/index.html')
          fi = fp.read_text(encoding='utf-8')
          ru = Path('ru/books/monolith/sludge/index.html').read_text(encoding='utf-8')
          tail = Path('.tmp/fi-sludge-tail-paragraphs.txt').read_text(encoding='utf-8').splitlines()
          assert len(tail) == 50, len(tail)

          def bounds(text):
              a = text.index('<div class="fragment">') + len('<div class="fragment">')
              b = text.index('</div></details>', a)
              return a,b,text[a:b]
          fa,fb,ff = bounds(fi)
          _,_,rf = bounds(ru)
          existing = re.findall(r'<p>(.*?)</p>', ff, flags=re.S)
          ru_ps = re.findall(r'<p>(.*?)</p>', rf, flags=re.S)
          assert len(existing) == 8, len(existing)
          assert len(ru_ps) == 59, len(ru_ps)
          all_fi = existing + tail
          assert len(all_fi) == 58
          fi = fi[:fa] + ''.join('<p>'+x+'</p>' for x in all_fi) + fi[fb:]
          fp.write_text(fi, encoding='utf-8')

          final = fp.read_text(encoding='utf-8')
          _,_,frag = bounds(final)
          assert len(re.findall(r'<p>(.*?)</p>', frag, flags=re.S)) == 58
          assert 'mäntylauta' in frag
          assert 'ulkopuolella toiminto, sisällä korvike' in frag
          assert 'pahempaa kuin mikään sana' in frag
          prof = p.read_text(encoding='utf-8')
          for x in ['id="trajectory"','VOICEPRINT','MY MEMORY','ei itsessään todista mekanismin yleispätevyyttä','vastaus ei sulje kysymystä']:
              assert x in prof
          print('PASS: Professional repaired; LIETE content restored (FI 58 p-elements; RU 59 due heading/split markup difference)')
          PY
      - name: Commit repairs and clean temporary files
        run: |
          rm -f .tmp/ru-sludge-fragment-paragraphs.txt .tmp/fi-sludge-tail-paragraphs.txt
          rm -f .github/workflows/repair-finnish-content-parity-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fi/professional/index.html fi/books/monolith/sludge/index.html .tmp/ru-sludge-fragment-paragraphs.txt .tmp/fi-sludge-tail-paragraphs.txt .github/workflows/repair-finnish-content-parity-once.yml
          git commit -m 'Restore Finnish content parity'
          git push