name: Correct thoughts navigation semantics once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/correct-thoughts-nav-semantics-once.yml'

permissions:
  contents: write

jobs:
  correct-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct navigation semantics in all languages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          labels = {
              'ru': ('Следующая дуга', 'Предыдущая дуга'),
              'en': ('Next arc', 'Previous arc'),
              'pl': ('Następny łuk', 'Poprzedni łuk'),
              'de': ('Nächster Bogen', 'Vorheriger Bogen'),
              'es': ('Arco siguiente', 'Arco anterior'),
              'fr': ('Arc suivant', 'Arc précédent'),
              'pt': ('Arco seguinte', 'Arco anterior'),
              'uk': ('Наступна дуга', 'Попередня дуга'),
              'be': ('Наступная дуга', 'Папярэдняя дуга'),
              'fi': ('Seuraava kaari', 'Edellinen kaari'),
          }
          nav_pat = re.compile(r'<div class=(["\'])nav-row\1>.*?</div>', re.S)
          menu_pat = re.compile(r'<div class=(["\'])menu\1>(.*?)</div>', re.S | re.I)
          nav_js_pat = re.compile(r"document\.getElementById\(['\"](?:prevArc|nextArc|toPublicBottom)['\"]\)\.href=[^;]+;")

          def public_label(html, lang):
              mm = menu_pat.search(html)
              if not mm:
                  raise SystemExit(f'No menu block for {lang}')
              menu = mm.group(2)
              m = re.search(rf'<a[^>]+href=["\'][^"\']*/{lang}/public/?["\'][^>]*>([^<]+)</a>', menu, re.I)
              if not m:
                  raise SystemExit(f'Cannot find Public label in menu for {lang}')
              return re.sub(r'\s+', ' ', m.group(1)).strip()

          for lang, (next_label, prev_label) in labels.items():
              base = Path(lang) / 'public' / 'thoughts'
              pages = {
                  1: base/'index-0001.html',
                  2: base/'index-0002.html',
                  3: base/'index.html',
              }
              for p in pages.values():
                  if not p.exists():
                      raise SystemExit(f'Missing {p}')

              texts = {k: p.read_text() for k,p in pages.items()}
              pub = {k: public_label(texts[k], lang) for k in (1,2,3)}

              for k in (1,2,3):
                  q = "'" if "class='nav-row'" in texts[k] else '"'
                  if k == 1:
                      nav = (f'<div class={q}nav-row{q}>'
                             f'<a class={q}btn{q} href={q}/{lang}/public/{q}>← {pub[k]}</a>'
                             f'<a class={q}btn{q} href={q}index-0002.html{q}>{next_label} →</a></div>')
                  elif k == 2:
                      nav = (f'<div class={q}nav-row{q}>'
                             f'<a class={q}btn{q} href={q}index-0001.html{q}>← {prev_label}</a>'
                             f'<a class={q}btn{q} href={q}/{lang}/public/thoughts/{q}>{next_label} →</a></div>')
                  else:
                      nav = (f'<div class={q}nav-row{q}>'
                             f'<a class={q}btn{q} href={q}/{lang}/public/{q}>← {pub[k]}</a>'
                             f'<a class={q}btn{q} href={q}index-0002.html{q}>{prev_label} →</a></div>')

                  out, n = nav_pat.subn(nav, texts[k], count=1)
                  if n != 1:
                      raise SystemExit(f'Nav replacement failed: {pages[k]}')
                  # Remove only obsolete bottom-navigation JS assignments so direct hrefs cannot be overridden.
                  out = nav_js_pat.sub('', out)
                  pages[k].write_text(out)

              # Strict final validation: visible labels and actual hrefs.
              checks = {
                  1: (f'/{lang}/public/', f'← {pub[1]}', 'index-0002.html', f'{next_label} →'),
                  2: ('index-0001.html', f'← {prev_label}', f'/{lang}/public/thoughts/', f'{next_label} →'),
                  3: (f'/{lang}/public/', f'← {pub[3]}', 'index-0002.html', f'{prev_label} →'),
              }
              for k, (left_href,left_text,right_href,right_text) in checks.items():
                  html = pages[k].read_text()
                  m = nav_pat.search(html)
                  if not m:
                      raise SystemExit(f'No final nav: {pages[k]}')
                  nav = m.group(0)
                  expected_left = f'href=' + ('"' if 'class="nav-row"' in nav else "'") + left_href
                  expected_right = f'href=' + ('"' if 'class="nav-row"' in nav else "'") + right_href
                  if left_text not in nav or right_text not in nav or expected_left not in nav or expected_right not in nav:
                      raise SystemExit(f'Final link validation failed: {pages[k]} :: {nav}')
                  if nav.find(left_text) > nav.find(right_text):
                      raise SystemExit(f'Final order failed: {pages[k]}')
                  if re.search(r'id=["\'](?:prevArc|nextArc|toPublicBottom)["\']', nav):
                      raise SystemExit(f'Stale nav ID remains: {pages[k]}')
              print(f'OK {lang}: 1 [Public | Next], 2 [Previous | Next], 3 [Public | Previous]')
          PY
      - name: Commit correction and remove one-time workflow
        run: |
          rm .github/workflows/correct-thoughts-nav-semantics-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Ashraellen@users.noreply.github.com"
          git add ru/public/thoughts en/public/thoughts pl/public/thoughts de/public/thoughts es/public/thoughts fr/public/thoughts pt/public/thoughts uk/public/thoughts be/public/thoughts fi/public/thoughts .github/workflows/correct-thoughts-nav-semantics-once.yml
          git commit -m "Correct thoughts navigation semantics across all languages"
          git push
