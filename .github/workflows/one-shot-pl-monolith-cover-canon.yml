name: One-shot Polish MONOLITH cover canon

on:
  push:
    paths:
      - '.github/workflows/one-shot-pl-monolith-cover-canon.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace Russian covers with Polish covers
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('pl/books/monolith/index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              '../../../assets/covers/beton-ru.webp': '../../../assets/covers/BETON_PL_COVER_FRONT_v02.webp',
              'alt="Rosyjska okładka BETON"': 'alt="Polska okładka BETON"',
              '../../../assets/covers/sludge-ru.webp': '../../../assets/covers/SLUDGE_PL_COVER_FRONT_v01.webp',
              'alt="Rosyjska okładka SZLAM"': 'alt="Polska okładka SZLAM"',
          }
          for old, new in replacements.items():
              if s.count(old) != 1:
                  raise SystemExit(f'Expected exactly one occurrence of {old!r}, found {s.count(old)}')
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
          git rm .github/workflows/one-shot-pl-monolith-cover-canon.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pl/books/monolith/index.html
          git commit -m "Use Polish covers on MONOLITH page"
          git push
