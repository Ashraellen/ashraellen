name: Stage 04 Radiance revision

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  revise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage04-radiance-revision-work
          fetch-depth: 0
      - name: Apply Stage 04 Radiance page revision
        shell: bash
        run: |
          cat > .stage04_radiance_revision.py <<'PY'
          from pathlib import Path
          import sys

          ROOT = Path('.')
          series_pages = {
              'pl': Path('pl/books/radiance/index.html'),
              'de': Path('de/books/radiance/index.html'),
              'fr': Path('fr/books/radiance/index.html'),
              'es': Path('es/books/radiance/index.html'),
              'pt': Path('pt/books/radiance/index.html'),
          }

          def replace_all(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Missing expected text for {label}: {old[:120]}')
              return text.replace(old, new)

          def replace_optional(text, old, new):
              return text.replace(old, new)

          # DECISION-0007: PL/DE/FR/ES/PT Radiance series pages use the EN series cover in metadata/JSON-LD.
          for lang, path in series_pages.items():
              text = path.read_text(encoding='utf-8')
              text = text.replace('radiance-series-cover-pl.webp', 'radiance-series-cover-en.webp')
              text = text.replace('radiance-series-cover-ru.webp', 'radiance-series-cover-en.webp')
              path.write_text(text, encoding='utf-8')

          # Polish editorial revision against the Russian source blocks.
          p = series_pages['pl']
          text = p.read_text(encoding='utf-8')
          text = replace_all(text, '„Blask” to literacki i filozoficzny cykl artystyczno-badawczy o tym, jak starożytne opowieści utrwalają figuratywne instrukcje dla świata.', '„Blask” to literacko-filozoficzny cykl artystyczno-badawczy o tym, jak dawne opowieści przechowują obrazowe instrukcje ku światu.', 'pl meta description')
          text = replace_all(text, 'Długoterminowy cykl, w którym forma sztuki staje się sposobem eksploracji.', 'Długoterminowy cykl, w którym forma artystyczna staje się sposobem badania.', 'pl lead')
          text = replace_all(text, 'Rama do nauki', 'Rama badawcza', 'pl CTA research')
          text = replace_all(text, '<div class="list-header"><h2>Co to jest „Blask”</h2><p class="note">krótki</p></div>', '<div class="list-header"><h2>Co to jest „Blask”</h2><p class="note">krótko</p></div>', 'pl short note')
          text = replace_all(text, '<strong>Promieniowanie / „Blask”</strong> to literacko-filozoficzna seria badań artystycznych na temat tego, jak starożytne opowieści zachowują wyobraźnię dla świata.', '<strong>Radiance / „Blask”</strong> to literacko-filozoficzny cykl artystyczno-badawczy o tym, jak dawne opowieści przechowują obrazowe instrukcje ku światu.', 'pl series definition')
          text = replace_all(text, 'Materiał fińsko-karelski i Kalevala stanowi główny północny kręgosłup cyklu. Próbujemy zrozumieć, jakie ludzkie doświadczenie sprawiło, że te obrazy stały się konieczne i czy forma sztuki może sprawić, że ta wiedza będzie ponownie słyszalna i wyraźnie zrozumiana.', 'Materiał fińsko-karelski i kalevalski stanowi główny północny kręgosłup cyklu. Próbujemy zrozumieć, jakie ludzkie doświadczenie uczyniło te obrazy potrzebnymi — i czy forma artystyczna może ponownie sprawić, że ta wiedza stanie się słyszalna i jasno rozumiana.', 'pl Kalevala block')
          text = replace_all(text, 'Słowo, słuch, język i dostrojenie. Druga książka stanowi kontynuację metody „Sampo” poprzez dźwięk i mowę: czy słowo może stać się scenerią, a nie hałasem?', 'Słowo, słuchanie, język i dostrojenie. Druga książka kontynuuje metodę „Sampo” poprzez dźwięk i mowę: czy słowo może stać się dostrojeniem, a nie hałasem?', 'pl Song description')
          text = replace_all(text, '<div class="list-header"><h2>Rama do badań artystycznych</h2><p class="note">dla funduszy i partnerów</p></div>', '<div class="list-header"><h2>Rama artystyczno-badawcza</h2><p class="note">dla funduszy i partnerów</p></div>', 'pl research heading')
          text = replace_all(text, '„Blask” nie dowodzi starożytnej prawdy jako tezy. Sprawdza, czy forma sztuki może ponownie sprawić, że będzie słyszalna i zrozumiała.', '„Blask” nie dowodzi dawnej prawdy jako tezy. Sprawdza, czy forma artystyczna może ponownie uczynić ją słyszalną i jasno rozumianą.', 'pl research quote')
          text = replace_all(text, '<p><strong>„Sampo”</strong> eksploruje instrukcję dotyczącą obfitości i uczestnictwa.</p>', '<p><strong>„Sampo”</strong> bada instrukcję dotyczącą obfitości i uczestnictwa.</p>', 'pl Sampo research')
          text = replace_all(text, '<p><strong>„Pieśń”</strong> omawia instrukcje dotyczące mówienia, słyszenia i dostrajania.</p>', '<p><strong>„Pieśń”</strong> bada instrukcję dotyczącą słowa, słuchania i dostrojenia.</p>', 'pl Song research')
          text = replace_all(text, 'Dalsze książki zawierają instrukcje dotyczące rzemiosła, progu, traumy, powrotu, narodzin, lasu, miary i odpowiedzialności.', 'Dalsze książki odsłaniają instrukcje dotyczące rzemiosła, progu, traumy, powrotu, narodzin, lasu, miary i odpowiedzialności.', 'pl future books')
          text = replace_all(text, 'To nie jest opowieść o micie czy mitologii dekoracyjnej. Jest to próba, poprzez powieść, scenę, rzecz, mowę, ciszę i ludzki wybór, przywrócenia antycznemu obrazowi jego siły roboczej.', 'To nie jest opowieść o micie ani dekoracyjna mitologia. To próba przywrócenia dawnemu obrazowi jego siły działania poprzez powieść, scenę, rzecz, mowę, milczenie i ludzki wybór.', 'pl research close')
          text = replace_all(text, '<div class="list-header"><h2>Karta instrukcji</h2><p class="note">zamierzone węzły pętli</p></div>', '<div class="list-header"><h2>Mapa instrukcji</h2><p class="note">wyznaczone węzły cyklu</p></div>', 'pl instruction map heading')
          text = replace_all(text, '<li><strong>Pieśń</strong><span>słowo, słuch, język, ustawienie.</span></li>', '<li><strong>Pieśń</strong><span>słowo, słuchanie, język, dostrojenie.</span></li>', 'pl Song map')
          text = replace_all(text, '<li><strong>Awaria</strong><span>uraz, uszkodzone pismo, fałszywy los.</span></li>', '<li><strong>Zakłócenie</strong><span>trauma, uszkodzony scenariusz, fałszywy los.</span></li>', 'pl glitch map')
          text = replace_all(text, '<li><strong>Powrót</strong><span>śmierć, rozkład, pasja, powrót.</span></li>', '<li><strong>Powrót</strong><span>śmierć, rozpad, namiętność, powrót.</span></li>', 'pl return map')
          text = replace_all(text, '<li><strong>Oddychanie</strong><span>narodziny, ciąża, stworzenie bez przemocy.</span></li>', '<li><strong>Oddech</strong><span>narodziny, noszenie życia, tworzenie bez przemocy.</span></li>', 'pl breath map')
          text = replace_all(text, '„Blask” nie jest opowieścią o mitologii, światem fantasy ani nauką duchową. Jest to literacki i filozoficzny cykl artystyczno-badawczy, w którym starożytne obrazy są uważane za żywe formy wiedzy.', '„Blask” nie jest opowieścią o mitologii, światem fantasy ani nauką duchową. To literacko-filozoficzny cykl artystyczno-badawczy, w którym dawne obrazy są traktowane jako żywe formy wiedzy.', 'pl boundary 1')
          text = replace_all(text, 'Projekt wykorzystuje mit nie jako dekorację, ale jako pamięć: z tym, co pomogło człowiekowi zrozumieć świat, miarę, pracę, słowo, strach, odpowiedzialność i połączenie z żywym porządkiem rzeczywistości.', 'Projekt pracuje z mitem nie jako z dekoracją, lecz jako z pamięcią: z tym, co pomagało człowiekowi rozumieć świat, miarę, pracę, słowo, strach, odpowiedzialność i więź z żywym porządkiem rzeczywistości.', 'pl boundary 2')
          p.write_text(text, encoding='utf-8')

          # Focused DE/FR/ES/PT visible-copy risk corrections.
          replacements = {
              'de': [
                  ('Studienrahmen', 'Forschungsrahmen'),
                  ('<strong>Ausstrahlung / „Glanz“</strong> ist eine literarische und philosophisch-künstlerische Forschungsreihe darüber, wie antike Geschichten fantasievolle Anweisungen für die Welt bewahren.', '<strong>Radiance / „Glanz“</strong> ist ein literarisch-philosophischer künstlerischer Forschungszyklus darüber, wie alte Geschichten bildhafte Anweisungen für die Welt bewahren.'),
                  ('Wort, Hören, Sprache und Abstimmung. Das zweite Buch führt die „Sampo“-Methode durch Klang und Sprache fort: Kann ein Wort eher zu einer Umgebung als zu Lärm werden?', 'Wort, Hören, Sprache und Abstimmung. Das zweite Buch führt die „Sampo“-Methode durch Klang und Sprache fort: Kann ein Wort eher zu einer Abstimmung als zu Lärm werden?'),
                  ('<p><strong>„Lied“</strong> erforscht Anweisungen zum Sprechen, Hören und Stimmen.</p>', '<p><strong>„Lied“</strong> erforscht die Anweisung zu Wort, Hören und Abstimmung.</p>'),
                  ('<li><strong>Lied</strong><span>Wort, Hören, Sprache, Umgebung.</span></li>', '<li><strong>Lied</strong><span>Wort, Hören, Sprache, Abstimmung.</span></li>'),
                  ('<li><strong>Schwellenwert</strong><span>Zugang, nördliche Stärke, Reife.</span></li>', '<li><strong>Schwelle</strong><span>Zugang, nördliche Kraft, Reife.</span></li>'),
                  ('<li><strong>Fehler</strong><span>Trauma, beschädigtes Drehbuch, falsches Schicksal.</span></li>', '<li><strong>Störung</strong><span>Trauma, beschädigtes Skript, falsches Schicksal.</span></li>'),
                  ('<li><strong>Zurück</strong><span>Tod, Verfall, Leidenschaft, Rückkehr.</span></li>', '<li><strong>Rückkehr</strong><span>Tod, Zerfall, Leidenschaft, Rückkehr.</span></li>'),
                  ('<a class="btn" href="https://www.ashraellen.com/de/books/radiance/sampo/">Offenes Buch</a>', '<a class="btn" href="https://www.ashraellen.com/de/books/radiance/sampo/">Buch öffnen</a>'),
                  ('<a class="btn" href="https://www.ashraellen.com/de/books/radiance/song/">Offenes Buch</a>', '<a class="btn" href="https://www.ashraellen.com/de/books/radiance/song/">Buch öffnen</a>'),
              ],
              'fr': [
                  ('Nous ne racontons pas "Kalevala".', 'Nous ne réécrivons pas « Kalevala ».'),
                  ('<div class="list-header"><h2>Qu\'est-ce que "Éclat"</h2><p class="note">court</p></div>', '<div class="list-header"><h2>Qu’est-ce qu’« Éclat »</h2><p class="note">en bref</p></div>'),
                  ('<strong>Radiance / "Éclat"</strong> est une série de recherches artistiques littéraires et philosophiques sur la manière dont les histoires anciennes préservent les instructions figuratives du monde.', '<strong>Radiance / « Éclat »</strong> est un cycle de recherche artistique littéraire et philosophique sur la manière dont les récits anciens préservent des instructions imagées pour le monde.'),
                  ('Nous essayons de comprendre pourquoi l\'expérience humaine a rendu ces images nécessaires - et si la forme d\'art peut rendre à nouveau ce savoir audible et clairement compris.', 'Nous essayons de comprendre quelle expérience humaine a rendu ces images nécessaires — et si la forme artistique peut rendre ce savoir de nouveau audible et clairement intelligible.'),
                  ('un mot peut-il devenir un décor plutôt qu\'un bruit ?', 'un mot peut-il devenir un accordage plutôt qu’un bruit ?'),
                  ('<p><strong>"Chant"</strong> explore l’enseignement sur la parole, l’audition et l’accordage.</p>', '<p><strong>« Chant »</strong> explore l’instruction de la parole, de l’écoute et de l’accordage.</p>'),
                  ('<li><strong>Échec</strong><span>traumatisme, scénario endommagé, faux destin.</span></li>', '<li><strong>Dérèglement</strong><span>traumatisme, scénario endommagé, faux destin.</span></li>'),
              ],
              'es': [
                  ('Marco de estudio', 'Marco de investigación'),
                  ('No volvemos a contar "Kalevala".', 'No recontamos «Kalevala».'),
                  ('<strong>Resplandor / "Resplandor"</strong> es una serie de investigación artística literaria y filosófica sobre cómo las historias antiguas preservan instrucciones imaginativas para el mundo.', '<strong>Radiance / «Resplandor»</strong> es un ciclo de investigación artística literaria y filosófica sobre cómo las historias antiguas preservan instrucciones figurativas para el mundo.'),
                  ('forma de oír el mundo', 'modo de escuchar el mundo'),
                  ('¿puede una palabra convertirse en escenario en lugar de ruido?', '¿puede una palabra convertirse en sintonía en lugar de ruido?'),
                  ('<div class="list-header"><h2>Tarjeta de instrucciones</h2><p class="note">nodos de bucle previstos</p></div>', '<div class="list-header"><h2>Mapa de instrucciones</h2><p class="note">nodos previstos del ciclo</p></div>'),
                  ('<li><strong>Canto</strong><span>palabra, audición, idioma, entorno.</span></li>', '<li><strong>Canto</strong><span>palabra, escucha, lenguaje, sintonía.</span></li>'),
                  ('<li><strong>Fallo</strong><span>trauma, guión dañado, destino falso.</span></li>', '<li><strong>Interrupción</strong><span>trauma, guion dañado, falso destino.</span></li>'),
                  ('<li><strong>Devolución</strong><span>muerte, decadencia, pasión, regreso.</span></li>', '<li><strong>Regreso</strong><span>muerte, descomposición, pasión, regreso.</span></li>'),
              ],
              'pt': [
                  ('Quadro de estudo', 'Quadro de pesquisa'),
                  ('Mostramos ao mundo de onde essas histórias podem surgir.', 'Mostramos o mundo de onde essas histórias poderiam surgir.'),
                  ('<strong>Radiância / "Esplendor"</strong> é uma série de pesquisa artística literária e filosófica sobre como histórias antigas preservam instruções imaginativas para o mundo.', '<strong>Radiance / "Esplendor"</strong> é um ciclo de pesquisa artística literária e filosófica sobre como histórias antigas preservam instruções imagéticas para o mundo.'),
                  ('uma palavra pode se tornar um cenário em vez de um ruído?', 'uma palavra pode se tornar sintonia em vez de ruído?'),
                  ('<div class="list-header"><h2>Cartão de instruções</h2><p class="note">nós de loop pretendidos</p></div>', '<div class="list-header"><h2>Mapa de instruções</h2><p class="note">nós previstos do ciclo</p></div>'),
                  ('<li><strong>Canto</strong><span>palavra, audição, linguagem, ambiente.</span></li>', '<li><strong>Canto</strong><span>palavra, escuta, linguagem, sintonia.</span></li>'),
                  ('<li><strong>Limite</strong><span>acesso, força norte, maturidade.</span></li>', '<li><strong>Limiar</strong><span>acesso, força do norte, maturidade.</span></li>'),
              ],
          }
          for lang, reps in replacements.items():
              path = series_pages[lang]
              text = path.read_text(encoding='utf-8')
              for old, new in reps:
                  if old not in text:
                      raise SystemExit(f'Missing expected {lang} text: {old[:120]}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          # Metadata description refinements for DE/FR/ES/PT where global exact phrases are present.
          meta_replacements = {
              'de': ('„Glanz“ ist ein literarischer und philosophischer Kunst- und Forschungszyklus darüber, wie antike Geschichten figurative Anweisungen für die Welt bewahren.', '„Glanz“ ist ein literarisch-philosophischer künstlerischer Forschungszyklus darüber, wie alte Geschichten bildhafte Anweisungen für die Welt bewahren.'),
              'fr': ('"Éclat" ne prouve pas une vérité ancienne en tant que thèse.', '« Éclat » ne prouve pas une vérité ancienne en tant que thèse.'),
              'es': ('"Resplandor" no prueba una verdad antigua como tesis.', '«Resplandor» no prueba una verdad antigua como tesis.'),
              'pt': ('"Esplendor" não prova uma verdade antiga como tese.', '"Esplendor" não prova uma verdade antiga como tese.'),
          }
          # Apply only non-noop first item replacements that are global metadata/body phrase matches.
          for lang, (old, new) in meta_replacements.items():
              if old != new:
                  path = series_pages[lang]
                  text = path.read_text(encoding='utf-8')
                  text = text.replace(old, new)
                  path.write_text(text, encoding='utf-8')

          # Validation.
          for lang, path in series_pages.items():
              text = path.read_text(encoding='utf-8')
              if 'radiance-series-cover-pl.webp' in text or 'radiance-series-cover-ru.webp' in text:
                  raise SystemExit(f'{path}: invalid series cover reference remains')
              if 'radiance-series-cover-en.webp' not in text:
                  raise SystemExit(f'{path}: required EN series cover missing')
          for lang, required in {
              'pl': ['Radiance / „Blask”', 'Rama badawcza', 'Rama artystyczno-badawcza', 'obrazowe instrukcje ku światu', 'dostrojeniem, a nie hałasem', '<strong>Zakłócenie</strong>'],
              'de': ['Radiance / „Glanz“', 'Forschungsrahmen', 'bildhafte Anweisungen', 'Abstimmung als zu Lärm', '<strong>Schwelle</strong>', '<strong>Störung</strong>'],
              'fr': ['Radiance / « Éclat »', 'instructions imagées pour le monde', 'un accordage plutôt qu’un bruit', '<strong>Dérèglement</strong>'],
              'es': ['Radiance / «Resplandor»', 'Marco de investigación', 'instrucciones figurativas', 'sintonía en lugar de ruido', 'Mapa de instrucciones'],
              'pt': ['Radiance / "Esplendor"', 'Quadro de pesquisa', 'instruções imagéticas', 'sintonia em vez de ruído', 'Mapa de instruções'],
          }.items():
              text = series_pages[lang].read_text(encoding='utf-8')
              for needle in required:
                  if needle not in text:
                      raise SystemExit(f'{series_pages[lang]}: required editorial marker missing: {needle}')

          for lang, expected in {'en':'en','be':'ru','uk':'ru'}.items():
              path = Path(f'{lang}/books/radiance/index.html')
              text = path.read_text(encoding='utf-8')
              if f'radiance-series-cover-{expected}.webp' not in text:
                  raise SystemExit(f'{path}: expected series cover {expected} not found')

          print('Stage 04 Radiance page revision validation passed.')
          PY
          python .stage04_radiance_revision.py
      - name: Commit page corrections
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pl/books/radiance/index.html de/books/radiance/index.html fr/books/radiance/index.html es/books/radiance/index.html pt/books/radiance/index.html
          git commit -m "Stage 04 revision: align Radiance series pages"
      - name: Regenerate sitemap and metadata reports
        shell: bash
        run: |
          node scripts/generate-sitemap.js
          node scripts/audit-page-metadata.js
          node scripts/export-page-keyword-workbench.js
      - name: Commit generated reports and remove temporary workflow
        shell: bash
        run: |
          rm -f .stage04_radiance_revision.py
          rm -f .github/workflows/stage04-radiance-revision.yml
          git add -A
          git commit -m "Stage 04 revision: update generated reports"
          git push origin HEAD:stage04-radiance-revision-work
