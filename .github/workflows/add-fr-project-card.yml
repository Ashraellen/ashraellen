name: Add French project card

on:
  push:
    paths:
      - '.github/workflows/add-fr-project-card.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Insert static HTML card
        shell: python
        run: |
          from pathlib import Path

          path = Path('fr/public/index.html')
          text = path.read_text(encoding='utf-8')
          old = "<section class='card'><h2>Publications</h2><p>Textes sortis du laboratoire et devenus message : pensées d’appui, fragments, réactions et observations.</p><a id='goPosts' href='posts/'>Ouvrir →</a></section></div>"
          new = "<section class='card'><h2>Publications</h2><p>Textes sortis du laboratoire et devenus message : pensées d’appui, fragments, réactions et observations.</p><a id='goPosts' href='posts/'>Ouvrir →</a></section><section class='card'><h2>Projets</h2><p>Les projets de recherche, littéraires et médiatiques d’Ashraellen — des champs de travail distincts réunis dans un même espace.</p><a href='https://www.ashraellen.com/fr/research/projects/'>Ouvrir →</a></section></div>"
          if old not in text:
              raise SystemExit('Target HTML fragment not found')
          updated = text.replace(old, new, 1)
          if updated.count('<h2>Projets</h2>') != 1:
              raise SystemExit('Unexpected project card count')
          path.write_text(updated, encoding='utf-8')
          Path('.github/workflows/add-fr-project-card.yml').unlink()
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fr/public/index.html .github/workflows/add-fr-project-card.yml
          git commit -m "Add French projects card"
          git push
