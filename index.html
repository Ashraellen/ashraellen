<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="theme-color" content="#0b0b0d">
  <title>Ashraellen — Entry</title>
  <meta name="description" content="Ashraellen: books, research, public texts, videos, audiobooks and inner observation."/>
  <link rel="stylesheet" href="assets/style.css">
  <script defer src="/assets/analytics.js"></script>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <style>
    .entry-note{margin:12px 0 0;max-width:34rem;color:rgba(242,242,244,.72);font-size:14px;line-height:1.25}.language-panel{display:flex;flex-wrap:wrap;gap:9px;margin-top:20px;max-width:42rem}.language-panel a{display:inline-flex;align-items:center;justify-content:center;padding:9px 12px;border:1px solid rgba(242,242,244,.16);border-radius:999px;background:rgba(255,255,255,.04);color:rgba(242,242,244,.92);font-size:13px;font-weight:600;text-decoration:none}.language-panel a:hover{background:rgba(255,255,255,.08);border-color:rgba(242,242,244,.32);text-decoration:none}.entry-footer{margin-top:22px;color:rgba(242,242,244,.48);font-size:12px;line-height:1.25}.entry-symbol{width:34px;height:auto;opacity:.74;margin-bottom:18px}.card h1{margin-top:0}.card .brand{letter-spacing:.22em;text-transform:uppercase}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <img class="entry-symbol" src="assets/symbol.png" alt="Ashraellen symbol">
      <div class="brand">Ashraellen</div>
      <h1>Choose your language</h1>
      <p class="entry-note">Books, research, public texts, videos, audiobooks and inner observation — gathered as one space.</p>
      <p class="entry-note">The site will open automatically using your browser language. You can also choose manually.</p>
      <div class="language-panel" id="langlist" aria-label="Language selection"></div>
      <footer class="entry-footer">A quieter entrance into a denser space.</footer>
    </div>
  </div>

<script>
(function(){
  const supported = [["en","English"],["ru","Русский"],["be","Беларуская"],["pl","Polski"],["uk","Українська"],["pt","Português"],["es","Español"],["fr","Français"],["de","Deutsch"]];
  const list = document.getElementById('langlist');
  const isGitHub = location.hostname.endsWith('github.io');
  const seg1 = location.pathname.split('/').filter(Boolean)[0];
  const base = isGitHub && seg1 ? `/${seg1}/` : `/`;

  supported.forEach(([code,name])=>{
    const a=document.createElement('a');
    a.href=base+code+'/';
    a.textContent=name;
    a.lang=code;
    list.appendChild(a);
  });

  const pref=(navigator.language||'en').slice(0,2).toLowerCase();
  const codes=supported.map(x=>x[0]);
  const target=codes.includes(pref)?pref:'en';
  const manual = new URLSearchParams(location.search).has('manual');
  if(!manual){
    setTimeout(()=>{ location.href=base+target+'/'; }, 650);
  }
})();
</script>
</body>
</html>
