<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Ashraellen</title>
  <link rel="stylesheet" href="assets/style.css">
  <meta name="robots" content="noindex,nofollow">
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="brand">Ashraellen</div>
      <h1>Choose language</h1>
      <p class="small">Auto-redirect uses browser language. If not, choose manually.</p>
      <div class="sub" id="langlist"></div>
      <footer>
        <span class="small">Starter scaffold for GitHub Pages.</span>
      </footer>
    </div>
  </div>

<script>
(function(){
  const supported = [["en","English"],["ru","Русский"],["pl","Polski"],["uk","Українська"],["pt","Português"],["es","Español"],["fr","Français"],["de","Deutsch"]];
  const list = document.getElementById('langlist');

  // Robust base path:
  // - On GitHub project pages: https://user.github.io/<repo>/  => base "/<repo>/"
  // - On custom domain: https://ashraellen.com/               => base "/"
  const isGitHub = location.hostname.endsWith('github.io');
  const seg1 = location.pathname.split('/').filter(Boolean)[0]; // repo name on GitHub Pages
  const base = isGitHub && seg1 ? `/${seg1}/` : `/`;

  supported.forEach(([code,label])=>{
    const a = document.createElement('a');
    a.href = base + code + '/';
    a.textContent = label + ' (' + code + ')';
    list.appendChild(a);
  });

  const lang = (navigator.language || 'en').toLowerCase();
  const guess = lang.split('-')[0];
  const codes = supported.map(x=>x[0]);
  const target = codes.includes(guess) ? guess : 'en';

  setTimeout(()=>{ window.location.replace(base + target + '/'); }, 250);
})();
</script>
</body>
</html>
