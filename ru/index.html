<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Ashraellen</title>

  <!-- GitHub Pages-safe base (project pages) -->
  <script>
  (function(){
    const isGitHub = location.hostname.endsWith('github.io');
    const repo = location.pathname.split('/').filter(Boolean)[0];
    window.__BASE__ = (isGitHub && repo) ? `/${repo}/` : `/`;
  })();
  </script>

  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <div class="wrap">
    <div class="entry">

      <section class="left">
        <div>
          <div class="brand">Ashraellen</div>
          <div class="h1">Исследование / Публичное</div>
          <p class="one">Два режима присутствия: один наблюдает, другой говорит.</p>

          <div class="actions">
            <a id="goResearch" href="#">Исследование</a>
            <a id="goPublic" href="#">Публичное</a>
          </div>

          <div class="langs">
            <a href="../en/">English</a>
            <a href="../pl/">Polski</a>
            <a href="../de/">Deutsch</a>
            <a href="../fr/">Français</a>
            <a href="../es/">Español</a>
            <a href="../pt/">Português</a>
            <a href="../uk/">Українська</a>
          </div>

          <div class="seal">
            <img id="sealImg" src="#" alt="Ashraellen symbol">
            <span>— mark of presence</span>
          </div>
        </div>

        <div style="height:1px"></div>
      </section>

      <aside class="right" aria-hidden="true">
        <img id="heroImg" src="#" alt="">
      </aside>

    </div>
  </div>

<script>
(function(){
  const base = window.__BASE__ || '/';
  // Correct links under GitHub project pages
  document.getElementById('goResearch').href = base + 'ru/research/';
  document.getElementById('goPublic').href   = base + 'ru/public/';
  document.getElementById('heroImg').src     = base + 'assets/hero.webp';
  document.getElementById('sealImg').src     = base + 'assets/symbol.png';
})();
</script>
</body>
</html>
