<body>
  <main>
    <section class="panel" aria-label="Demotopia permanent book passport entrance">
      <p class="brand">Ashraellen · samizdat 2.0</p>
      <h1>Demotopia</h1>
      <p class="note">Opening the book passport in your saved or browser language.</p>
      <a class="fallback" href="/en/books/samizdat/demotopia/">Open English passport</a>
    </section>
  </main>
  <script>
  (function(){
    const key='ashraellen-language';
    const supported=['en','ru','pl'];
    const saved=(localStorage.getItem(key)||'').slice(0,2).toLowerCase();
    const browser=(navigator.language||'en').slice(0,2).toLowerCase();
    const lang=supported.includes(saved)?saved:(supported.includes(browser)?browser:'en');
    const targets={
      en:'/en/books/samizdat/demotopia/',
      ru:'/ru/books/samizdat/demotopia/',
      pl:'/pl/books/samizdat/demotopia/'
    };
    location.replace(targets[lang]);
  })();
  </script>
