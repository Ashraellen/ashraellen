<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Ashraellen</title>

  <script>
  (function(){
    const isGitHub = location.hostname.endsWith('github.io');
    const repo = location.pathname.split('/').filter(Boolean)[0];
    window.__BASE__ = (isGitHub && repo) ? `/${repo}/` : `/`;
  })();
  </script>

  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <div class="wrap">
    <div class="entry">
      <section class="left">

        <div class="brand">Ashraellen</div>

        <p class="one">
          Three directions of presence: <br>
          one observes, <br>
          one speaks, <br>
          one becomes a book.
        </p>

        <div class="actions">
          <a id="goResearch" href="#">Research</a>
          <a id="goPublic" href="#">Public</a>
          <a id="goBooks" href="#">Books</a>
        </div>

        <div class="langs">
          <a href="../ru/">Русский</a>
          <a href="../pl/">Polski</a>
          <a href="../de/">Deutsch</a>
          <a href="../fr/">Français</a>
          <a href="../es/">Español</a>
          <a href="../pt/">Português</a>
          <a href="../uk/">Українська</a>
        </div>

        <div class="seal">
          <img id="sealImg" src="#" alt="Ashraellen symbol">
          <span>— mark of presence</span>
        </div>

      </section>
    </div>
  </div>

  <script>
  (function(){
    const base = window.__BASE__ || '/';
    document.getElementById('goResearch').href = base + 'en/research/';
    document.getElementById('goPublic').href   = base + 'en/public/';
    document.getElementById('goBooks').href    = base + 'en/books/';
    document.getElementById('sealImg').src     = base + 'assets/symbol.png';
  })();
  </script>
</body>
</html>
