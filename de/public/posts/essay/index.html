<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Ashraellen — Mini-Essays</title>

  <script>
  (function(){
    const isGitHub = location.hostname.endsWith('github.io');
    const repo = location.pathname.split('/').filter(Boolean)[0];
    window.__BASE__ = (isGitHub && repo) ? `/${repo}/` : `/`;
  })();
  </script>

  <link rel="stylesheet" href="../../../../assets/mini-essay.css">
</head>
<body>
  <div class="wrap">
    <div class="page">
      <header class="site-header">
        <p class="brand">Ashraellen</p>
        <div class="menu">
          <a id="toEntry" href="#">Einstieg</a> |
          <a id="toPublic" href="#">Öffentlich</a> |
          <a id="toResearch" href="#">Forschung</a>
        </div>
      </header>

      <main class="main">
        <div class="container">
          <h1 class="h1">Mini-Essays</h1>
          <p class="lead">
            Kurze Analysen: eine Frage, ein Blickwinkel, ein Schluss.
            Ohne Drama — mit Klarheit.
          </p>

          <section class="list">
            <div class="list-header">
              <h2>Liste</h2>
              <p class="note"><a id="toPosts" href="#">zurück zum Inhaltsverzeichnis</a></p>
            </div>

            <ul class="items">
              <li class="item">
                <div>
                  <a href="#">Beitrag 003 — Mini-Essay (bald)</a>
                  <div class="meta">Platzhalter für zukünftigen Text.</div>
                </div>
                <span class="badge">essay</span>
              </li>
            </ul>
          </section>

          <div class="seal">
            <img id="sealImg" src="#" alt="symbol">
            <span>— mark of presence</span>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script>
  (function(){
    const base = window.__BASE__ || '/';
    document.getElementById('toEntry').href    = base + 'de/';
    document.getElementById('toPublic').href   = base + 'de/public/';
    document.getElementById('toResearch').href = base + 'de/research/';
    document.getElementById('toPosts').href    = base + 'de/public/posts/';
    document.getElementById('sealImg').src     = base + 'assets/symbol.png';
  })();
  </script>
</body>
</html>
